sures\":[],\"version\":14,\"id_type\":\"userID\",\"value\":{\"version\":1,\"internal_employee_bypass_plan_entitlements\":true,\"categories\":{\"investor_presentations\":{\"enabled\":true,\"additional_allowed_plan_types\":[],\"allow_enterprisey\":true,\"workspace_permission\":\"chatgpt.workspace.feature.findata-investor-presentations.access\"},\"market_pricing\":{\"allow_enterprisey\":false,\"workspace_permission\":\"chatgpt.workspace.feature.finserv.access\",\"enabled\":true,\"additional_allowed_plan_types\":[]},\"company_filings\":{\"allow_enterprisey\":true,\"enabled\":true,\"workspace_permission\":\"chatgpt.workspace.feature.findata-company-filings.access\",\"additional_allowed_plan_types\":[\"free\",\"go\",\"plus\",\"prolite\",\"pro\",\"team\",\"self_serve_business_prolite\",\"self_serve_business_usage_based\",\"free_workspace\"]},\"investor_reports\":{\"allow_enterprisey\":true,\"additional_allowed_plan_types\":[],\"enabled\":true,\"workspace_permission\":\"chatgpt.workspace.feature.findata-investor-reports.access\"},\"earnings_calls\":{\"additional_allowed_plan_types\":[],\"enabled\":true,\"workspace_permission\":\"chatgpt.workspace.feature.findata-earnings-calls.access\",\"allow_enterprisey\":true},\"financial_metrics\":{\"enabled\":true,\"workspace_permission\":\"chatgpt.workspace.feature.finserv.access\",\"allow_enterprisey\":false,\"additional_allowed_plan_types\":[]}},\"workspace_parent_permission\":\"chatgpt.workspace.feature.finserv.access\"},\"is_device_based\":false,\"passed\":false},\"1655736916\":{\"name\":\"1655736916\",\"rule_id\":\"default\",\"secondary_exposures\":[],\"version\":280,\"id_type\":\"userID\",\"value\":{\"dailyBriefingInstructions\":\"For daily briefings, recurring briefings, or briefing automations, use normal automation and verified connected-app capabilities directly. Reuse existing connections, avoid unrelated setup, and show the automation before enabling it.\",\"artifactInstructions\":\"For presentations, documents, PDFs, spreadsheets, or similar artifacts, infer the right format from the user's goal and default to a presentation when unclear. Create the actual file, not just an outline. Keep the first result compact: at most three slides or pages, or one primary spreadsheet sheet with up to two supporting sheets. Use a clean, modern editorial style with strong hierarchy, generous whitespace, restrained color, and one clear idea per section. Ask at most one focused question before creating unless essential information is missing. Once you have enough information to create the artifact—and after any required question—briefly say once: \\\"This may take a few minutes. Feel free to work on something else or step away—I’ll keep going, and you don’t need to watch over it.\\\" Then begin creating it immediately. Do not ask the user to acknowledge this message or repeat it in later progress updates. Never invent facts or accomplishments. After delivery, offer one useful improvement or an optional, confirmed cloud save.\",\"websiteInstructions\":\"For websites, landing pages, or interactive prototypes, use the user's stated idea or infer a useful direction from reliable context. Build and privately host a responsive, personal, clean, modern one-page site with at most three strong sections, one clear purpose, and one primary action. Use available real content and clearly labeled placeholders. Before building, invoke `request_user_input` once to clarify the highest-impact product decision for the first version. Prefer asking which functionality the site should prioritize, tailoring two or three concrete feature bundles to the user's goal—for example, showcasing work, collecting leads, booking appointments, selling something, or publishing content. Put the most sensible option first and mark it as recommended. If the requested features are already clear, ask about the next most consequential unresolved choice, such as the audience, primary action, or visual direction. Keep the question and options concise, do not repeat information the user already provided, and do not turn this into a requirements interview. After the user answers, briefly say once: \\\"This may take a few minutes. Feel free to work on something else or step away—I’ll keep going, and you don’t need to watch over it.\\\" Then build immediately without another question unless privacy or a critical ambiguity blocks progress. Do not ask the user to acknowledge this message or repeat it in later progress updates. Never copy protected brand assets or broaden visibility without confirmation.\",\"emailMessagingInstructions\":\"For email or messaging tasks, first reuse a verified connected inbox, messaging account, or workspace. If none is connected and the user has not declined the relevant app, identify an appropriate provider from reliable context and actually invoke its native installation or connection tool. Never claim a connection card exists unless the tool that generates it has been called. If the user declines that app, acknowledge the decision and immediately continue without it in the same response: use another already-connected source, existing context, past conversations, or material already provided. Do not turn the task into a request for pasted messages, uploads, or other manual homework solely because one app was declined. If a later, genuinely separate step requires another app the user has not declined, its connection may be offered normally. When access is available, immediately demonstrate one useful, read-only result, such as important emails, upcoming deadlines, messages needing attention, a concise conversation summary, or reviewable draft replies. Offer a recurring summary only after showing its value and obtaining explicit confirmation. Never request credentials, send messages, or modify account state without explicit confirmation.\",\"appConnectionInstructions\":\"RESUME IMMEDIATELY AFTER APP CONNECTION ELICITATION.\\n\\nWhen an app connection or authorization elicitation returns, treat the return as confirmation that the user connected the app and wants the original task to continue.\\n\\nDo not ask the user to approve, connect, confirm, or acknowledge the app. Do not claim that approval is pending.\\n\\nImmediately attempt a relevant read-only operation using the app. If it succeeds, the app is connected. Continue the original workflow in the same response.\\n\\nOnly state that the app is unavailable if a fresh read-only operation fails. Earlier connection cards, assistant messages, and pending tool results are not authoritative after the elicitation returns.\\n\\nNever require another user message to resume the workflow.\\n\\nHANDLE APP CONNECTION DECLINES.\\n\\nIf an app connection, authorization, or approval tool returns a deny or decline result, treat that result as an explicit refusal to connect the app. A denial is not a successful connection and takes precedence over the normal instructions for resuming after an elicitation.\\n\\nIf the user clearly says they do not want to connect an app while its connection request is pending, honor that refusal as well. Do not treat unrelated messages or answers to unrelated questions as a denial.\\n\\nAfter either kind of refusal, continue the original task immediately without the declined app, using available context, past conversations, or already-connected tools. Do not require another user message, ask the user to type “skip,” retry the declined connection, or request replacement samples, uploads, or other manual inputs. A refusal applies only to the specific app unless the user declines all connections. Offer another app only when it is genuinely required for a separate next step.\\n\\nTrack app connection decisions separately for each app. An app has been requested only if you actually invoked its own installation, connection, or authorization tool and showed its connection card. Mentioning an app in a plan, checking its availability, or receiving a denial for another app does not mean it was requested or declined. After one app is denied, continue offering other relevant apps that have not yet been requested, one at a time. Never claim that an app was already requested, declined, or skipped unless that app’s own connection request actually occurred.\\n\\nA declined app-connection request applies only to the app associated with that specific tool call. After a decline, revisit the user’s original request and identify any other requested apps that have not been individually declined. Immediately invoke the connection tool for the next requested app. Never assume that declining one app declines others, even if they were requested together. For example, if the user requests Gmail and Google Calendar and declines Gmail, your next action must be to request Google Calendar.\\n\\nAn app connection request pauses the workflow until the user responds. When the request returns, immediately continue the workflow in the same response. If the app was declined, do not check it again. Instead, immediately invoke the connection request for the next app the user asked for. Do not wait for another user message or end your response while another requested app still needs a connection.\\n\\nWhen an onboarding task needs an app, plugin, connector, or external work tool, first reuse a verified relevant installation and connection. Otherwise identify the best relevant permitted app from the user’s available plugin catalog; onboarding recommendations and role-based shortlists are hints, not the complete catalog. Exclude apps disabled by an administrator, marked NOT_AVAILABLE, or already declined. If an appropriate app is not connected, actually invoke the available native in-conversation plugin-installation or connection tool to display its connection card. Merely mentioning an app, describing a connection, or referring to a card does not create one. Invoke the installation or connection tool directly in the same response. Never say \\\"use the card above,\\\" \\\"click Connect,\\\" or otherwise imply that a card exists unless the tool that displays it has actually been invoked. Request only one connection at a time. If the user approves, verify the app is installed and connected, resume the original task, and produce a concrete result. If the user declines, acknowledge the decision once and immediately proceed without that app in the same response. Never end the response after the acknowledgment or wait for the user to type another message. When the next legitimate step requires a different app that has not been declined, you may invoke that app’s connection flow; otherwise continue the task using available context, past conversations, or connected tools. Do not replace the original workflow with a request for samples, uploads, pasted material, or other homework. Never retry the declined app or pretend disconnected data is accessible. If no installation tool is available, say so plainly and continue with the best available fallback.\\n\\nWhen a task depends on the user’s projects, conversations, documents, or other work context, first check relevant connected apps. If none is connected and the user has not declined the relevant app, briefly explain what is needed and actually invoke its native installation or connection tool. Do not refer to a card that has not been generated. If the connection is declined, acknowledge it once and immediately, in the same response, continue the task using available context, past conversations, already-connected tools, or material the user has already provided. Do not ask the user to collect or supply replacement material merely because they skipped a connection. A different app may be offered only when it is genuinely required for a separate next step and has not been declined. Do not request information an already-connected app can provide or default to placeholders when real context is available.\\n\\nAFTER AN APP CONNECTION OR AUTHORIZATION FLOW RETURNS, TREAT IT AS A SIGNAL TO RESUME THE 5\":14,\"_326\":14,\"_327\":-5},\"28\",{\"_192\":337,\"_325\":14,\"_326\":14,\"_327\":-5},\"29\",{\"_192\":336,\"_325\":14,\"_326\":14,\"_327\":-5},\"30\",{\"_192\":335,\"_325\":14,\"_326\":14,\"_327\":-5},\"31\",{\"_192\":334,\"_325\":14,\"_326\":14,\"_327\":-5},\"32\",{\"_192\":333,\"_325\":14,\"_326\":14,\"_327\":-5},\"33\",{\"_192\":332,\"_325\":14,\"_326\":14,\"_327\":-5},\"34\",{\"_192\":331,\"_325\":14,\"_326\":14,\"_327\":-5},\"35\",{\"_192\":330,\"_325\":14,\"_326\":14,\"_327\":-5},\"36\",{\"_192\":329,\"_325\":14,\"_326\":14,\"_327\":-5},\"37\",{\"_192\":328,\"_325\":14,\"_326\":14,\"_327\":-5},\"38\",{\"_192\":324,\"_325\":14,\"_326\":14,\"_327\":-5},\"vym59b\",\"edited\",\"previewable\",\"preview_language\",\"5hkk76\",\"7o04il\",\"nccsrs\",\"9ugth2\",\"72khyl\",\"g9xpol\",\"aoel8i\",\"k3fcuz\",\"9citab\",\"fwiuhc\",\"foe8fk\",\"b1g7j8\",\"2p9kk7\",\"ka5vmj\",\"mhim5q\",\"zhz97v\",\"w8p001\",\"j2mj4r\",\"arbkh8\",\"o4zikh\",\"bkdqhr\",\"rrjlcy\",\"sp92bc\",\"g5xf12\",\"hlkt0k\",\"dmx5pa\",\"gdflwf\",\"8cq5d0\",\"dspx3z\",\"xohk94\",\"wl0uks\",\"irp6it\",\"l6gwlu\",\"n74mku\",\"blowd7\",\"7ixrc5\",\"0inr0q\",\"7jlbof\",\"stop\",\"stop_tokens\",[369],200002,\"content_type\",\"text\",\"parts\",[374],\"可以。基于我刚才实际看过你 **Novora 2.7.3** 的代码后，我建议把 **2.7.3 → 2.8** 定位得非常明确：\\n\\n\u003e **2.8 = 考试管理基础版本**\\n\u003e\\n\u003e 不做大型考试平台，不做 Agent，不做完整楼控；重点把现有“考试编辑/发布/显示”体系，上升为真正的“考试管理”。\\n\\n而且原则是：**增量改造，不推翻 2.7.3 已有的同步、离线、MajorExam、周测、设备体系。**\\n\\n---\\n\\n# Novora 2.7.3 → 2.8 总体规划\\n\\n```text id=\\\"xw4yqb\\\"\\n                    Novora 2.7.3\\n                         │\\n                         │\\n              ┌──────────▼──────────┐\\n              │   现有考试运行体系    │\\n              │ MajorExam / ExamItem │\\n              │ exam_data / 同步     │\\n              └──────────┬──────────┘\\n                         │\\n                  2.8 增加管理层\\n                         │\\n              ┌──────────▼──────────┐\\n              │      ExamRecord     │\\n              │     考试管理实体      │\\n              └──────────┬──────────┘\\n                         │\\n        ┌────────────────┼────────────────┐\\n        ▼                ▼                ▼\\n     考试管理          考试详情          历史考试\\n        │                │                │\\n        └────────────────┼────────────────┘\\n                         ▼\\n                    现有 MajorExam\\n                         │\\n                         ▼\\n                      大屏显示\\n```\\n\\n---\\n\\n# 一、2.8 的核心目标\\n\\n2.8 只解决五件事情：\\n\\n### ① 管得住\\n\\n考试数量增加以后不会乱。\\n\\n### ② 找得到\\n\\n能够搜索、筛选历史考试。\\n\\n### ③ 看得懂\\n\\n每场考试有独立详情。\\n\\n### ④ 接得上\\n\\n新考试管理层和现有 `MajorExam` 正确关联。\\n\\n### ⑤ 不破坏\\n\\n2.7.3 已有的大屏、周测、同步、离线、快速考试继续正常运行。\\n\\n---\\n\\n# 二、2.8 第一部分：考试数据层\\n\\n这是整个版本最重要的工作。\\n\\n## 2.8.0 新增 ExamRecord\\n\\n现有：\\n\\n```text id=\\\"k4o1m2\\\"\\nMajorExam\\n```\\n\\n继续保留。\\n\\n新增：\\n\\n```text id=\\\"s9x2cg\\\"\\nExamRecord\\n```\\n\\n负责描述：\\n\\n\u003e **“这是一场什么考试？”**\\n\\n而 `MajorExam` 继续负责：\\n\\n\u003e **“这场考试具体显示什么？”**\\n\\n---\\n\\n## ExamRecord 第一版字段\\n\\n```text id=\\\"k1y2bx\\\"\\nid\\nname\\ndescription\\n\\nstatus\\n\\nstartAt\\nendAt\\nactualStartAt\\nactualEndAt\\n\\nruntimeMajorId\\n\\nsource\\ntemporary\\n\\ntargetGradeIds\\ntargetClassIds\\n\\ncreatedBy\\ncreatedAt\\nupdatedAt\\narchivedAt\\n```\\n\\n暂时不需要把所有 `MajorExam` 内容复制一遍。\\n\\n---\\n\\n# 三、2.8 第二部分：考试状态\\n\\n建立统一状态：\\n\\n```text id=\\\"p3w6i9\\\"\\nDRAFT\\n  ↓\\nPUBLISHED\\n  ↓\\nWAITING\\n  ↓\\nRUNNING\\n  ↓\\nFINISHED\\n  ↓\\nARCHIVED\\n```\\n\\n### 各状态含义\\n\\n**DRAFT**\\n\\n正在编辑。\\n\\n**PUBLISHED**\\n\\n已经发布，但考试还没有开始。\\n\\n**WAITING**\\n\\n等待开始。\\n\\n**RUNNING**\\n\\n正在考试。\\n\\n**FINISHED**\\n\\n考试已经结束。\\n\\n**ARCHIVED**\\n\\n进入历史考试。\\n\\n---\\n\\n## 为什么这一步很重要？\\n\\n你目前很多考试逻辑已经会根据时间判断状态。\\n\\n2.8 要做的是：\\n\\n\u003e **把状态判断统一起来。**\\n\\n以后：\\n\\n- 管理后台\\n- 考试态势\\n- 大屏\\n- Agent\\n- 楼控\\n\\n都使用统一状态。\\n\\n---\\n\\n# 四、2.8 第三部分：考试管理首页\\n\\n新增：\\n\\n\u003e **考试管理**\\n\\n它不是替代现在的“大型考试编辑页面”。\\n\\n而是在上面增加一层。\\n\\n---\\n\\n## 页面结构\\n\\n```text id=\\\"j3qj2r\\\"\\n考试管理\\n\\n全部 | 草稿 | 待开始 | 进行中 | 已结束 | 历史\\n\\n[搜索考试]\\n\\n时间范围 ▼\\n考试类型 ▼\\n状态 ▼\\n```\\n\\n列表：\\n\\n```text id=\\\"x8kq7p\\\"\\n┌────────────────────────────────────┐\\n│ 2026 秋季期中考试                   │\\n│ 2026-09-15 09:00 - 11:00            │\\n│                                     │\\n│ 进行中                              │\\n│ 12 个教室                           │\\n│                                     │\\n│ [查看] [控制]                       │\\n└────────────────────────────────────┘\\n```\\n\\n---\\n\\n# 五、2.8 第四部分：考试详情\\n\\n点击考试：\\n\\n```text id=\\\"2t5q9f\\\"\\n考试详情\\n\\n2026 秋季期中考试\\n\\n状态\\n进行中\\n\\n考试时间\\n09:00 - 11:00\\n\\n考试范围\\nA栋 / B栋\\n\\n关联考试\\nMajorExam #xxxx\\n\\n创建人\\n管理员\\n\\n创建时间\\n2026-08-27\\n```\\n\\n操作：\\n\\n```text id=\\\"j1t5ry\\\"\\n[编辑]\\n[查看考试]\\n[复制]\\n[归档]\\n```\\n\\n注意：\\n\\n**2.8 暂时不做完整考试控制中心。**\\n\\n开始、暂停、延时等复杂控制放到 2.9。\\n\\n---\\n\\n# 六、2.8 第五部分：把现有大型考试接进管理系统\\n\\n这是代码改造重点。\\n\\n现在：\\n\\n```text id=\\\"1mbf4j\\\"\\n创建大型考试\\n      ↓\\nMajorExam\\n      ↓\\nexam_data\\n```\\n\\n2.8：\\n\\n```text id=\\\"8z5j3p\\\"\\n创建考试\\n      ↓\\nExamRecord\\n      ↓\\n创建 MajorExam\\n      ↓\\nruntimeMajorId\\n      ↓\\nexam_data\\n```\\n\\n这样以后可以知道：\\n\\n\u003e ExamRecord X 对应当前运行的 MajorExam Y。\\n\\n---\\n\\n# 七、2.8 第六部分：快速考试接入\\n\\n你现在已经有快速考试：\\n\\n```text id=\\\"a9d7q2\\\"\\npublishQuickMajor()\\nextendQuickMajor()\\nendQuickMajor()\\npromoteQuickMajor()\\n```\\n\\n这一套不要废。\\n\\n2.8 改成：\\n\\n```text id=\\\"c8p4s1\\\"\\n快速考试\\n    ↓\\n创建 ExamRecord\\n    ↓\\n创建 MajorExam\\n    ↓\\n发布\\n```\\n\\n因此快速考试也会自动进入：\\n\\n**考试管理 → 历史考试。**\\n\\n这是非常值得做的。\\n\\n---\\n\\n# 八、2.8 第七部分：历史考试\\n\\n增加：\\n\\n\u003e **历史考试**\\n\\n但第一版不需要复杂化。\\n\\n只要：\\n\\n```text id=\\\"s3j8vn\\\"\\n考试结束\\n   ↓\\nFINISHED\\n   ↓\\nARCHIVED\\n```\\n\\n历史考试依然使用 `ExamRecord`。\\n\\n---\\n\\n## 历史考试可以：\\n\\n- 查看\\n- 搜索\\n- 查看详情\\n- 查看考试配置\\n- 复制\\n\\n## 暂时不能：\\n\\n- 直接修改\\n- 直接重新开始\\n- 修改原考试记录\\n\\n---\\n\\n# 九、2.8 第八部分：复制考试\\n\\n这个功能强烈建议一起做。\\n\\n例如：\\n\\n```text id=\\\"n9w5bz\\\"\\n2026 春季期中考试\\n        ↓\\n       复制\\n        ↓\\n2026 秋季期中考试\\n```\\n\\n复制：\\n\\n- 考试名称\\n- 考试配置\\n- 考试范围\\n- 显示配置\\n- MajorExam 配置\\n\\n重新生成：\\n\\n- ExamRecord ID\\n- MajorExam ID\\n- 时间\\n- 创建时间\\n\\n不复制：\\n\\n- 日志\\n- 发布状态\\n- 实际开始时间\\n- 实际结束时间\\n\\n---\\n\\n# 十、2.8 第九部分：搜索和筛选\\n\\n这个看起来简单，但对未来很重要。\\n\\n至少支持：\\n\\n### 搜索\\n\\n```text id=\\\"j2g8pv\\\"\\n考试名称\\n考试编号\\n```\\n\\n### 筛选\\n\\n```text id=\\\"9d5q5b\\\"\\n状态\\n日期\\n考试类型\\n创建人\\n```\\n\\n### 排序\\n\\n```text id=\\\"p7b8tq\\\"\\n最新创建\\n最近开始\\n最近结束\\n```\\n\\n这样以后哪怕有几百场考试，也能快速找到。\\n\\n---\\n\\n# 十一、2.8 第十部分：前端代码整理\\n\\n这里不要重构整个项目。\\n\\n重点是：\\n\\n### 当前\\n\\n```text id=\\\"j6x0qm\\\"\\nAdminPage\\n   └── MajorTabPanel\\n```\\n\\n继续保留。\\n\\n新增：\\n\\n```text id=\\\"f1d4sg\\\"\\nAdminPage\\n   │\\n   ├── 考试管理\\n   │      ├── ExamManagementPanel\\n   │      ├── ExamList\\n   │      ├── ExamFilters\\n   │      └── ExamDetail\\n   │\\n   └── 大型考试\\n          └── MajorTabPanel\\n```\\n\\n也就是说：\\n\\n\u003e **考试管理负责“找考试、看考试、管理考试”。**\\n\\n\u003e **大型考试负责“编辑考试内容”。**\\n\\n---\\n\\n# 十二、2.8 后端代码调整\\n\\n重点新增：\\n\\n```text id=\\\"c5n7q8\\\"\\napi/_exams/\\n├── examRecordTypes.ts\\n├── examRecords.ts\\n└── routes/\\n    └── examRecordRoutes.ts\\n```\\n\\n现有：\\n\\n```text id=\\\"5s3h1m\\\"\\napi/exams.ts\\napi/_exams/db.ts\\napi/_exams/payload.ts\\napi/_exams/diff.ts\\napi/_exams/permissions.ts\\n```\\n\\n**尽量保留。**\\n\\n尤其：\\n\\n```text id=\\\"d6j1v4\\\"\\nexamDataRoutes\\nexamOutbox\\nETag\\n三方合并\\n```\\n\\n不要因为做 2.8 而重写。\\n\\n---\\n\\n# 十三、2.8 数据库规划\\n\\n新增：\\n\\n```text id=\\\"h2q7vn\\\"\\nexam_records\\n```\\n\\n第一版重点：\\n\\n```text id=\\\"w8y4jp\\\"\\nid\\nname\\ndescription\\nstatus\\n\\nstart_at\\nend_at\\nactual_start_at\\nactual_end_at\\n\\nruntime_major_id\\n\\nsource\\ntemporary\\n\\ntarget_grade_ids\\ntarget_class_ids\\n\\ncreated_by\\ncreated_at\\nupdated_at\\narchived_at\\n```\\n\\n### 不建议 2.8 改动\\n\\n```text id=\\\"q5l3w8\\\"\\nexam_data\\n```\\n\\n继续保持现在的：\\n\\n\u003e 单实例运行数据 + JSONB\\n\\n结构。\\n\\n---\\n\\n# 十四、2.8 暂时不做什么\\n\\n这一点非常重要。\\n\\n## 不做考生系统\\n\\n```text id=\\\"7v1k3q\\\"\\n❌ 考生账号\\n❌ 报名\\n❌ 身份验证\\n❌ 考场签到\\n```\\n\\n## 不做题库\\n\\n```text id=\\\"h6p9rm\\\"\\n❌ 题库\\n❌ 组卷\\n❌ 阅卷\\n❌ 成绩\\n```\\n\\n## 不做完整楼控\\n\\n```text id=\\\"d2k8sx\\\"\\n❌ 远程重启\\n❌ 远程关机\\n❌ 教学楼地图\\n❌ 大规模设备控制\\n```\\n\\n## 不做 Agent\\n\\n```text id=\\\"q4y7nt\\\"\\n❌ Windows Agent\\n❌ Linux Agent\\n❌ 自动更新\\n```\\n\\n这些全部留到后面。\\n\\n---\\n\\n# 十五、2.8 的版本拆分\\n\\n我建议不要把所有东西一次塞进 `2.8.0`。\\n\\n### 2.8.0 —— 数据基础\\n\\n```text id=\\\"n5k8az\\\"\\n□ ExamRecord 数据模型\\n□ exam_records 数据表\\n□ ExamStatus\\n□ API\\n□ Service\\n□ MajorExam ↔ ExamRecord 关联\\n```\\n\\n这是**基础版本**。\\n\\n---\\n\\n### 2.8.1 —— 考试管理\\n\\n```text id=\\\"c4v6pr\\\"\\n□ 考试管理首页\\n□ 考试列表\\n□ 状态筛选\\n□ 时间筛选\\n□ 搜索\\n□ 考试状态显示\\n```\\n\\n---\\n\\n### 2.8.2 —— 考试详情\\n\\n```text id=\\\"m8y3fz\\\"\\n□ 考试详情\\n□ 编辑入口\\n□ 查看考试\\n□ 考试范围\\n□ 显示配置\\n□ 关联 MajorExam\\n```\\n\\n---\\n\\n### 2.8.3 —— 快速考试整合\\n\\n```text id=\\\"s1q9cx\\\"\\n□ 快速考试创建 ExamRecord\\n□ 快速考试进入管理列表\\n□ 快速考试结束状态同步\\n□ promoteQuickMajor 保留\\n```\\n\\n---\\n\\n### 2.8.4 —— 历史考试\\n\\n```text id=\\\"e7k2mv\\\"\\n□ FINISHED\\n□ ARCHIVED\\n□ 历史考试列表\\n□ 历史考试搜索\\n□ 历史考试详情\\n```\\n\\n---\\n\\n### 2.8.5 —— 复制考试\\n\\n```text id=\\\"r3v8kb\\\"\\n□ 复制考试\\n□ 复制 MajorExam\\n□ 新建 ExamRecord\\n□ 自动生成新 ID\\n□ 清理原状态/时间/日志\\n```\\n\\n---\\n\\n### 2.8.6 —— 稳定性版本\\n\\n重点不是增加功能。\\n\\n而是：\\n\\n```text id=\\\"p6z4sh\\\"\\n□ 旧数据兼容\\n□ 2.7.3 数据迁移\\n□ 离线状态测试\\n□ 多管理员并发测试\\n□ ETag 冲突测试\\n□ 快速考试测试\\n□ 周测兼容测试\\n□ 大屏显示测试\\n```\\n\\n---\\n\\n# 十六、2.8 完成后的产品结构\\n\\n最终会变成：\\n\\n```text id=\\\"b0g7yd\\\"\\nNovora\\n│\\n├── 总览\\n│\\n├── 考试\\n│   │\\n│   ├── 考试管理\\n│   │    ├── 全部\\n│   │    ├── 草稿\\n│   │    ├── 待开始\\n│   │    ├── 进行中\\n│   │    └── 已结束\\n│   │\\n│   ├── 大型考试\\n│   │    └── 原有 MajorExam 编辑\\n│   │\\n│   └── 历史考试\\n│\\n├── 周测\\n│\\n├── 设备\\n│\\n├── 数据大屏\\n│\\n└── 设置\\n```\\n\\n这时候 Novora 的核心就会从：\\n\\n\u003e **“一个考试大屏工具”**\\n\\n进一步变成：\\n\\n\u003e **“以考试显示为核心，同时具备基础考试管理能力的校园考试工具”。**\\n\\n---\\n\\n# 十七、2.8 完成标准\\n\\n我建议你不要用“代码写完了”判断 2.8 是否完成，而用下面这个闭环判断：\\n\\n```text id=\\\"k9q2xr\\\"\\n创建考试\\n   ↓\\n保存草稿\\n   ↓\\n出现在考试管理\\n   ↓\\n查看详情\\n   ↓\\n编辑大型考试内容\\n   ↓\\n关联现有 MajorExam\\n   ↓\\n发布\\n   ↓\\n大屏正常显示\\n   ↓\\n考试结束\\n   ↓\\n进入已结束\\n   ↓\\n归档\\n   ↓\\n历史考试\\n   ↓\\n复制\\n   ↓\\n生成下一场考试\\n```\\n\\n**这个闭环跑通，2.8 才算真正完成。**\\n\\n---\\n\\n## 最后给你一个开发优先级\\n\\n如果你现在马上开始写代码，我建议严格按照：\\n\\n**P0**\\n\\n\u003e `ExamRecord + 状态 + 数据库 + MajorExam关联`\\n\\n↓\\n\\n**P1**\\n\\n\u003e `考试管理列表 + 搜索 + 筛选 + 详情`\\n\\n↓\\n\\n**P1**\\n\\n\u003e `快速考试接入 + 正式考试接入`\\n\\n↓\\n\\n**P1**\\n\\n\u003e `历史考试 + 归档`\\n\\n↓\\n\\n**P2**\\n\\n\u003e `复制考试`\\n\\n↓\\n\\n**P2**\\n\\n\u003e `兼容性/并发/离线测试`\\n\\n而 **2.9 再做考试控制、公告、延时、操作日志深化、发布记录**。\\n\\n这样最符合你现在的代码基础，也能最大程度避免为了未来功能过度设计。\",\"role\",\"assistant\",{},{\"_192\":196,\"_199\":381,\"_54\":382,\"_56\":383,\"_203\":384,\"_205\":206,\"_208\":209,\"_210\":385,\"_212\":213},\"5c82709d-d315-4eda-a5f8-1840ac650862\",[86],{\"_375\":403,\"_210\":404},1787764988.264661,1787765010.047426,{\"_370\":371,\"_372\":401},{\"_239\":72,\"_71\":72,\"_386\":14,\"_228\":387,\"_388\":389,\"_390\":391,\"_392\":14,\"_393\":394,\"_395\":14,\"_396\":14,\"_397\":14,\"_398\":399,\"_232\":233,\"_400\":-5,\"_236\":237,\"_238\":237,\"_244\":10,\"_242\":14},\"is_visually_hidden_from_conversation\",[],\"search_queries\",[],\"image_results\",[],\"real_time_audio_has_video\",\"system_hints\",[],\"dictation\",\"voice_mode_message\",\"trigger_async_ux\",\"writing_blocks\",{},\"message_source\",[402],\"那先帮我整理2.7.3到2.8的规划\",\"user\",{},{\"_192\":379,\"_199\":408,\"_54\":409,\"_56\":410,\"_203\":411,\"_205\":206,\"_207\":34,\"_208\":209,\"_210\":412,\"_212\":213,\"_214\":215},\"79790e3c-50dd-41ea-9aeb-530450740b5c\",[196],{\"_375\":376,\"_210\":927},1787764572.830105,1787764594.077116,{\"_370\":371,\"_372\":925},{\"_216\":413,\"_218\":34,\"_221\":414,\"_228\":415,\"_67\":416,\"_223\":417,\"_219\":418,\"_225\":115,\"_226\":419,\"_230\":231,\"_232\":420,\"_234\":235, :782,\"_601\":-5,\"_597\":-5,\"_798\":799,\"_800\":-5,\"_801\":911,\"_772\":912,\"_804\":-5,\"_805\":-5},[],[913],{\"_603\":209,\"_605\":808,\"_607\":604},548,565,[557],[],[920],[],{\"_53\":774,\"_41\":557,\"_602\":782,\"_601\":-5,\"_597\":-5,\"_800\":-5,\"_801\":921,\"_772\":922,\"_804\":-5,\"_805\":-5},[],[923],{\"_603\":722,\"_605\":808,\"_607\":604},[369],[926],\"可以。我继续按 **Novora 当前 GitHub main / 2.7.3 的真实代码**往下看了。现在已经能比较明确地确定：**2.8 不应该重做现有考试系统，而应该在现有 `MajorExam + exam_data + 云同步` 架构上做一层“考试管理层”。**\\n\\n下面这份比前面的规划更具体，已经可以作为你 2.8 的开发任务拆分。\\n\\n---\\n\\n# 一、先说结论：你现在的代码不用推倒重来\\n\\n目前核心链路实际上是：\\n\\n```text\\nAdminPage\\n    ↓\\nuseMajorScheduleActions\\n    ↓\\nMajorExam[]\\n    ↓\\nbuildPayload()\\n    ↓\\nsaveExamsToServer()\\n    ↓\\nPOST /api/exams\\n    ↓\\nexamDataRoutes\\n    ↓\\nexam_data\\n```\\n\\n这条链路目前是稳定的，而且已经有：\\n\\n- 乐观并发控制\\n- ETag\\n- 离线队列\\n- 三方合并\\n- 权限\\n- 审计\\n- 快速考试\\n- 临时考试\\n- 考试延长\\n- 提前结束\\n\\n例如现在的 `useMajorScheduleActions` 已经直接实现了“快速发布、延长 5 分钟、提前结束、转正式考试”等能力。citeturn5view0\\n\\n所以：\\n\\n\u003e **2.8 的任务不是重写考试系统，而是在现有“大型考试”之上增加“考试管理生命周期”。**\\n\\n---\\n\\n# 二、现在真正的问题在哪里？\\n\\n你现在数据库核心是：\\n\\n```text\\nexam_data\\nid = 1\\n```\\n\\n而且里面把大量内容全部放在一行 JSONB 中：\\n\\n```text\\nitems\\nmajors\\nactive_major_id\\nalerts\\nweekly_plans\\ngrades\\nclasses\\ninitialization\\ndesign_policy\\n...\\n```\\n\\n数据库代码明确就是 `exam_data` 单行结构，而且 `id` 还有 `CHECK (id = 1)`。citeturn1view0\\n\\n也就是说：\\n\\n```text\\n整个 Novora 当前考试数据\\n        ↓\\n一条 exam_data\\n        ↓\\nmajors[]\\n        ↓\\n多个 MajorExam\\n```\\n\\n这个设计对于你目前的：\\n\\n\u003e “学校当前正在使用的考试安排”\\n\\n非常合适。\\n\\n但是到了我们规划的：\\n\\n\u003e **考试管理 / 历史考试 / 搜索 / 状态 / 发布记录**\\n\\n就开始不合适。\\n\\n---\\n\\n# 三、因此 2.8 最关键的架构调整\\n\\n不要直接把 `exam_data` 改成一堆考试。\\n\\n而是增加一个：\\n\\n## `exam_records`\\n\\n它负责：\\n\\n\u003e **“一场考试是什么”**\\n\\n而现有 `exam_data` 继续负责：\\n\\n\u003e **“当前 Novora 看板运行什么”**\\n\\n形成：\\n\\n```text\\n                    ┌──────────────┐\\n                    │ exam_records │\\n                    │   考试管理层  │\\n                    └──────┬───────┘\\n                           │\\n                 当前考试配置/运行配置\\n                           ↓\\n                    ┌──────────────┐\\n                    │  exam_data   │\\n                    │ 运行数据层    │\\n                    └──────┬───────┘\\n                           ↓\\n                     Novora大屏\\n```\\n\\n这是我现在根据你真实代码后，最建议的方案。\\n\\n---\\n\\n# 四、2.8 数据库具体怎么改\\n\\n## 新增 `exam_records`\\n\\n建议第一版字段：\\n\\n```text id=\\\"r6t4rj\\\"\\nexam_records\\n\\nid                  UUID / TEXT\\nname                TEXT\\ndescription         TEXT\\nstatus              TEXT\\n\\nstart_at            BIGINT\\nend_at              BIGINT\\n\\nactual_start_at     BIGINT\\nactual_end_at       BIGINT\\n\\nsource              TEXT\\ntemporary           BOOLEAN\\n\\ntarget_grade_ids    JSONB\\ntarget_class_ids    JSONB\\n\\nconfig              JSONB\\n\\ncreated_by          BIGINT\\ncreated_at          BIGINT\\nupdated_at          BIGINT\\n\\narchived_at         BIGINT\\n```\\n\\n### 状态：\\n\\n```text\\ndraft\\npublished\\nwaiting\\nrunning\\nfinished\\narchived\\n```\\n\\n---\\n\\n# 五、但是不要马上删除 `MajorExam`\\n\\n这是最重要的一点。\\n\\n你当前 `MajorExam` 仍然继续存在。\\n\\n因为现在：\\n\\n```text\\nMajorExam\\n├─ id\\n├─ name\\n├─ items\\n├─ order\\n├─ targetGradeIds\\n├─ targetClassIds\\n├─ source\\n├─ temporary\\n├─ priorityOverSchedule\\n├─ createdAt\\n├─ createdBy\\n└─ endedAt\\n```\\n\\n已经承担了很多业务逻辑。比如快速考试就是直接生成一个 `MajorExam`，然后写回 `majors`。citeturn5view0\\n\\n所以 2.8 不应该做：\\n\\n```text\\nMajorExam 删除\\n↓\\nExamRecord 全部替代\\n```\\n\\n而应该：\\n\\n```text\\nExamRecord\\n   │\\n   └── majorId / runtimeMajorId\\n             ↓\\n        MajorExam\\n```\\n\\n先建立映射。\\n\\n---\\n\\n# 六、2.8.0：新增考试管理数据层\\n\\n### 新增\\n\\n```text\\napi/_exams/\\n├── examRecords.ts\\n├── examRecordTypes.ts\\n└── routes/\\n    └── examRecordRoutes.ts\\n```\\n\\n前端：\\n\\n```text\\nsrc/\\n├── services/\\n│   └── examRecordService.ts\\n│\\n└── types/\\n    └── examRecord.ts\\n```\\n\\n---\\n\\n# 七、`examRecord.ts` 应该是什么\\n\\n建议：\\n\\n```text\\nExamRecord\\n\\nid\\nname\\ndescription\\n\\nstatus\\n\\nstartAt\\nendAt\\nactualStartAt\\nactualEndAt\\n\\nsource\\ntemporary\\n\\ntargetGradeIds\\ntargetClassIds\\n\\nruntimeMajorId\\n\\ncreatedBy\\ncreatedAt\\nupdatedAt\\narchivedAt\\n```\\n\\n注意：\\n\\n**不要把 `items` 一开始就拆出来。**\\n\\n可以先：\\n\\n```text\\nconfig: {\\n    major: MajorExam\\n}\\n```\\n\\n这样你的现有 `MajorExam` 可以直接复用。\\n\\n---\\n\\n# 八、2.8.0 API\\n\\n增加：\\n\\n```text\\nGET    /api/exams?action=list\\nGET    /api/exams?action=get\u0026id=xxx\\n\\nPOST   /api/exams\\nPUT    /api/exams\\nDELETE /api/exams\\n```\\n\\n或者保持你目前 `action` 路由体系：\\n\\n```text\\naction=exam-list\\naction=exam-get\\naction=exam-create\\naction=exam-update\\naction=exam-delete\\n```\\n\\n我更建议你保持现在的 action 风格。\\n\\n因为当前 `api/exams.ts → routes` 已经是按 action 分发的，没必要突然换成另一套 API 风格。citeturn3view0\\n\\n---\\n\\n# 九、2.8.1：考试管理列表\\n\\n这时候才开始改前端。\\n\\n你现在 `AdminPage` 已经不是一个“巨型单文件逻辑页面”了。\\n\\n它实际上已经把领域拆成：\\n\\n- `useMajorScheduleActions`\\n- `useExamItemActions`\\n- `useWeeklyScheduleSync`\\n- `useSchoolStructureActions`\\n- `useAdminSyncEngine`\\n\\n并且大型考试本身已经有专门的 `MajorTabPanel`。citeturn3view1turn4view3\\n\\n所以：\\n\\n## 不建议继续往 `AdminPage.tsx` 塞。\\n\\n新增：\\n\\n```text\\nsrc/components/exam/\\n├── ExamManagementPanel.tsx\\n├── ExamList.tsx\\n├── ExamListItem.tsx\\n├── ExamFilters.tsx\\n├── ExamStatusBadge.tsx\\n└── ExamEmptyState.tsx\\n```\\n\\n然后：\\n\\n```text\\nAdminPage\\n    ↓\\nAdminTab\\n    ↓\\nExamManagementPanel\\n```\\n\\n---\\n\\n# 十、这里要区分两个概念\\n\\n你现在的：\\n\\n\u003e **大型考试**\\n\\n继续保留。\\n\\n以后新增：\\n\\n\u003e **考试管理**\\n\\n两者不是完全一样。\\n\\n### 大型考试\\n\\n是：\\n\\n\u003e 实际编辑考试安排的工作区。\\n\\n也就是你现在 `MajorTabPanel` 干的事情。\\n\\n### 考试管理\\n\\n是：\\n\\n\u003e 管理“有哪些考试”。\\n\\n例如：\\n\\n```text\\n考试管理\\n\\n2026 秋季期中考试\\n进行中\\n\\n2026 英语等级考试\\n待开始\\n\\n2026 春季期末考试\\n已结束\\n\\n2025 秋季期末考试\\n历史\\n```\\n\\n点击：\\n\\n**2026 秋季期中考试**\\n\\n才进入现有的：\\n\\n\u003e 大型考试编辑界面。\\n\\n这样你现有功能几乎不用推翻。\\n\\n---\\n\\n# 十一、2.8.2：状态计算\\n\\n这是第二个重点。\\n\\n现在 `useMajorScheduleActions` 已经通过考试项目的 `startTime/endTime` 动态计算考试处于：\\n\\n```text\\n进行中\\n待开始\\n结束\\n```\\n\\n例如它排序时已经根据 `now` 和考试项目时间判断当前阶段。citeturn5view0\\n\\n但是以后不能让每个前端组件自己计算。\\n\\n新增：\\n\\n```text\\nsrc/utils/examStatus.ts\\n```\\n\\n统一：\\n\\n```text\\ngetExamStatus(exam)\\n```\\n\\n返回：\\n\\n```text\\nDRAFT\\nPUBLISHED\\nWAITING\\nRUNNING\\nFINISHED\\nARCHIVED\\n```\\n\\n这样：\\n\\n- Admin\\n- Dashboard\\n- 考试态势\\n- 手机端\\n- Agent\\n\\n全部用同一个状态判断。\\n\\n---\\n\\n# 十二、2.8.3：把当前快速考试能力接入考试管理\\n\\n你现在已经有：\\n\\n```text\\npublishQuickMajor()\\nextendQuickMajor()\\nendQuickMajor()\\npromoteQuickMajor()\\n```\\n\\n这非常好。\\n\\n现在不要重写。\\n\\n而是改成：\\n\\n```text\\n快速发布\\n    ↓\\n创建 ExamRecord\\n    ↓\\n生成 MajorExam\\n    ↓\\n写入 exam_data\\n    ↓\\n发布到设备\\n```\\n\\n于是：\\n\\n### 快速考试\\n\\n仍然保持现在的操作体验。\\n\\n但背后同时有：\\n\\n```text\\nExamRecord\\n+\\nMajorExam\\n```\\n\\n这样以后它才可以进入历史考试。\\n\\n---\\n\\n# 十三、2.8.4：正式考试也接入\\n\\n现在创建大型考试的代码就在：\\n\\n`useMajorScheduleActions → commitMajorModal`\\n\\n里面。\\n\\n目前新增考试实际上是：\\n\\n```text\\nconst nm: MajorExam = {\\n    id: genMajorId(),\\n    name,\\n    items: [],\\n    order: majors.length,\\n    targetGradeIds: ...\\n}\\n```\\n\\n然后直接 `commit()`。citeturn5view0\\n\\n2.8 改成：\\n\\n```text\\n创建 ExamRecord\\n        ↓\\n生成 runtime MajorExam\\n        ↓\\n写入 exam_data\\n        ↓\\n建立关联\\n```\\n\\n这样以后：\\n\\n```text\\nExamRecord ID\\n      ↓\\nMajorExam ID\\n```\\n\\n可以追踪。\\n\\n---\\n\\n# 十四、2.8.5：历史考试\\n\\n这时候就非常简单了。\\n\\n考试结束：\\n\\n```text\\nRUNNING\\n ↓\\nFINISHED\\n```\\n\\n然后管理员可以：\\n\\n```text\\n归档\\n ↓\\nARCHIVED\\n```\\n\\n历史考试实际上就是：\\n\\n```sql\\nstatus = 'archived'\\n```\\n\\n**第一版甚至不需要另外建 history 表。**\\n\\n这比我前面直接说“历史考试单独存储”更加贴合你现在的架构。\\n\\n---\\n\\n# 十五、为什么不建议 2.8 就删除 exam_data 里的 MajorExam？\\n\\n因为你的现有同步系统很复杂。\\n\\n目前：\\n\\n```text\\nAdmin\\n ↓\\nlocalStorage\\n ↓\\nexamOutbox\\n ↓\\nthreeWayMergeExam\\n ↓\\nexam_data\\n ↓\\n大屏\\n```\\n\\n已经支持：\\n\\n- 离线\\n- 冲突合并\\n- ETag\\n- 乐观锁\\n- 自动重试\\n\\n例如当前保存逻辑就是通过 `baseUpdatedAt` 做乐观并发控制，冲突后进行三方合并。citeturn3view0turn5view0\\n\\n如果现在把 `MajorExam[]` 完全改成新的数据库结构：\\n\\n**风险非常大。**\\n\\n所以第一阶段一定要：\\n\\n\u003e **新增管理层，不破坏运行层。**\\n\\n---\\n\\n# 十六、2.9 才开始做真正的考试控制\\n\\n2.9 的时候：\\n\\n```text\\nExamRecord\\n ↓\\nExamControl\\n```\\n\\n新增：\\n\\n```text\\nPOST action=exam-start\\nPOST action=exam-pause\\nPOST action=exam-resume\\nPOST action=exam-extend\\nPOST action=exam-finish\\n```\\n\\n然后控制操作同时：\\n\\n### 修改 ExamRecord\\n\\n```text\\nstatus\\nactualStartAt\\nactualEndAt\\n```\\n\\n### 修改 MajorExam\\n\\n例如：\\n\\n```text\\nitems[].enabled\\nitems[].endTime\\nendedAt\\n```\\n\\n### 写操作日志\\n\\n---\\n\\n# 十七、2.9 的日志表\\n\\n你现有后端已经在考试数据更新时调用：\\n\\n```text\\nwriteAudit(actor, 'exam-data.update', ...)\\n```\\n\\n所以你其实已经有审计基础。citeturn3view0\\n\\n2.9 不需要重新造日志系统。\\n\\n应该把：\\n\\n```text\\nexam-data.update\\n```\\n\\n进一步细分成：\\n\\n```text\\nexam.create\\nexam.update\\nexam.publish\\nexam.start\\nexam.pause\\nexam.resume\\nexam.extend\\nexam.finish\\nexam.archive\\nexam.duplicate\\n```\\n\\n这样以后 Agent、楼控都能复用。\\n\\n---\\n\\n# 十八、AdminPage 最终怎么变化\\n\\n现在：\\n\\n```text\\nAdminPage\\n ├─ Overview\\n ├─ Dashboard\\n ├─ Major\\n ├─ Weekly\\n ├─ Classes\\n ├─ Devices\\n └─ Users\\n```\\n\\n我建议 2.8 **不要直接把 Major 改名为考试管理**。\\n\\n而是：\\n\\n```text\\nAdminPage\\n ├─ Overview\\n ├─ Dashboard\\n ├─ 考试管理\\n │    ├─ 考试列表\\n │    └─ 考试详情\\n │\\n ├─ 大型考试\\n │    └─ 现有 MajorTabPanel\\n │\\n ├─ Weekly\\n ├─ Classes\\n ├─ Devices\\n └─ Users\\n```\\n\\n不过最终 UI 上也可以把：\\n\\n\u003e **考试管理 + 大型考试**\\n\\n合并成一个“考试”一级模块，里面再分：\\n\\n```text\\n考试\\n├─ 考试管理\\n├─ 当前考试\\n└─ 历史考试\\n```\\n\\n我更推荐这个。\\n\\n---\\n\\n# 十九、你现在这些文件具体怎么处理\\n\\n| 文件 | 2.8处理 |\\n|---|---|\\n| `api/exams.ts` | **基本不动** |\\n| `api/_exams/db.ts` | **新增 exam_records 表** |\\n| `api/_exams/payload.ts` | **基本不动** |\\n| `api/_exams/routes/examDataRoutes.ts` | **基本不动** |\\n| `api/_exams/permissions.ts` | 增加考试管理权限判断 |\\n| `api/_exams/types.ts` | 增加 `ExamRecord` 类型 |\\n| `src/types/index.ts` | **尽量不动 MajorExam** |\\n| `src/types/exam.ts` | 增加考试管理类型 |\\n| `src/services/examService.ts` | 保持现有同步逻辑 |\\n| `src/hooks/admin/useMajorScheduleActions.ts` | 小幅修改，建立 ExamRecord 关联 |\\n| `src/pages/AdminPage.tsx` | **只增加模块入口，不继续塞业务逻辑** |\\n| `src/components/major/MajorTabPanel` | **基本不动** |\\n| `src/services/examOutbox.ts` | 暂时不动 |\\n| `src/utils/examMerge.ts` | 暂时不动 |\\n| `src/utils/examSchedule.ts` | 暂时不动 |\\n\\n---\\n\\n# 二十、第一阶段新增文件\\n\\n我建议控制在这些：\\n\\n```text\\napi/_exams/\\n├── examRecordTypes.ts\\n├── examRecords.ts\\n└── routes/\\n    └── examRecordRoutes.ts\\n\\nsrc/\\n├── types/\\n│   └── examRecord.ts\\n│\\n├── services/\\n│   └── examRecordService.ts\\n│\\n├── utils/\\n│   └── examStatus.ts\\n│\\n└── components/\\n    └── exam/\\n        ├── ExamManagementPanel.tsx\\n        ├── ExamList.tsx\\n        ├── ExamFilters.tsx\\n        ├── ExamStatusBadge.tsx\\n        └── ExamDetailPanel.tsx\\n```\\n\\n**先不要一下子增加几十个文件。**\\n\\n---\\n\\n# 二十一、2.8 的实际开发顺序\\n\\n如果让我按照你的代码直接排开发任务，我会这样排：\\n\\n### 2.8.0\\n\\n**① 数据库**\\n\\n```text\\nexam_records\\n```\\n\\n↓\\n\\n**② 类型**\\n\\n```text\\nExamRecord\\nExamStatus\\n```\\n\\n↓\\n\\n**③ API**\\n\\n```text\\nlist\\nget\\ncreate\\nupdate\\narchive\\nduplicate\\n```\\n\\n↓\\n\\n**④ Service**\\n\\n```text\\nexamRecordService\\n```\\n\\n---\\n\\n### 2.8.1\\n\\n**⑤ 考试管理 UI**\\n\\n```text\\n考试列表\\n↓\\n搜索\\n↓\\n状态筛选\\n↓\\n时间筛选\\n```\\n\\n---\\n\\n### 2.8.2\\n\\n**⑥ 考试详情**\\n\\n```text\\n基础信息\\n考试时间\\n考试范围\\n当前状态\\n关联 MajorExam\\n```\\n\\n↓\\n\\n点击：\\n\\n**编辑考试**\\n\\n进入你现在的 `MajorTabPanel`。\\n\\n---\\n\\n### 2.8.3\\n\\n**⑦ 快速考试接入**\\n\\n把现在：\\n\\n```text\\npublishQuickMajor()\\n```\\n\\n接入 `ExamRecord`。\\n\\n---\\n\\n### 2.8.4\\n\\n**⑧ 正式大型考试接入**\\n\\n把：\\n\\n```text\\ncommitMajorModal()\\n```\\n\\n接入 `ExamRecord`。\\n\\n---\\n\\n### 2.8.5\\n\\n**⑨ 历史考试**\\n\\n```text\\nFINISHED\\n↓\\nARCHIVED\\n```\\n\\n加：\\n\\n```text\\n复制考试\\n```\\n\\n---\\n\\n# 二十二、然后才进入 2.9\\n\\n2.9：\\n\\n```text\\n考试控制\\n├─ 开始\\n├─ 暂停\\n├─ 继续\\n├─ 延长\\n├─ 公告\\n└─ 结束\\n```\\n\\n同时：\\n\\n```text\\n操作日志\\n发布记录\\n设备状态\\n异常提示\\n```\\n\\n---\\n\\n# 二十三、这次实际读取代码后，我最建议你注意的一点\\n\\n你的现有架构其实已经有一个很好的思想：\\n\\n\u003e **“大屏运行数据”和“后台编辑逻辑”正在逐渐解耦。**\\n\\n`exam.ts` 明确把 `ScheduleMode` 定义成“大屏运行模式”，并特别说明它与后台编辑 Tab 解耦；周测也是先在后台保存规则，再在运行时展开成标准 `ExamItem`，最终由大屏统一消费。citeturn4view0\\n\\n这个设计应该继续保持。\\n\\n所以以后我们要形成三个层：\\n\\n```text\\n┌─────────────────────────────┐\\n│       考试管理层             │\\n│ ExamRecord                  │\\n│ 状态 / 时间 / 历史 / 日志     │\\n└──────────────┬──────────────┘\\n               ↓\\n┌─────────────────────────────┐\\n│       考试运行层             │\\n│ MajorExam / ExamItem        │\\n│ 当前考试 / 周测 / 调度        │\\n└──────────────┬──────────────┘\\n               ↓\\n┌─────────────────────────────┐\\n│       大屏显示层             │\\n│ ExamPage / Dashboard        │\\n│ 时间 / 倒计时 / 公告          │\\n└─────────────────────────────┘\\n```\\n\\n这套结构**非常适合你后面继续加 Agent 和楼控**。\\n\\n---\\n\\n## 目前我的判断\\n\\n**2.7.3 → 2.8 不需要“大重构”。**\\n\\n真正需要做的是：\\n\\n\u003e **给现有 `MajorExam` 增加一个上层的 `ExamRecord` 管理层。**\\n\\n这样你现在的考试编辑、周测、同步、离线队列、冲突合并、大屏显示都可以继续工作，同时获得：\\n\\n**考试列表 → 状态 → 详情 → 发布 → 历史 → 复制**\\n\\n这条完整链路。\\n\\n而且我建议**先不要动 `exam_data` 的核心结构**。它现在承担的是整个 Novora 当前运行配置，贸然改成“一场考试一条数据库记录”反而会破坏你已经做好的同步架构。当前 `exam_data` 单行 JSONB 设计和 `updated_at` 乐观并发机制已经相当明确。citeturn1view0turn3view0\\n\\n下一步如果继续往代码层走，我建议就直接进入 **“2.8.0 数据库和类型怎么写”**：我可以根据你仓库现有 `db.ts / types.ts / permissions.ts / _auth.ts` 的实际写法，直接给出**具体应该新增哪些表、字段、索引、TypeScript 类型，以及现有代码具体在哪几个位置接入**。\",{\"_928\":929},\"real_author\",\"tool:web\",{\"_192\":406,\"_199\":933,\"_54\":934,\"_203\":935,\"_205\":206,\"_207\":14,\"_208\":209,\"_210\":936,\"_212\":213},\"11c87a12-d022-4045-b6aa-ab82df3fb5a7\",[379],{\"_375\":376,\"_210\":949},1787764573.170095,{\"_370\":947,\"_203\":948},{\"_937\":938,\"_939\":707,\"_940\":941,\"_942\":943,\"_944\":945,\"_230\":231,\"_232\":420,\"_234\":235,\"_236\":421,\"_238\":421,\"_225\":115,\"_239\":115,\"_71\":72,\"_240\":946,\"_242\":14,\"_243\":931,\"_244\":10},\"reasoning_status\" cService.ts\\n├── adminAuthService.ts\\n├── examPublishService.ts\\n└── examControlService.ts\\n```\\n\\n但**不要 2.8 一次全部拆完**。\\n\\n第一阶段只拆最明显的职责。\\n\\n---\\n\\n# ② `src/types/exam.ts`\\n\\n这个文件目前只有 192 行，而且它已经存在非常成熟的：\\n\\n- `ScheduleMode`\\n- `WeeklyPlan`\\n- `WeeklyExamItem`\\n- `WeeklyExamOverride`\\n- `ExamBoardData`\\n- `MajorScheduleBlock`\\n- `ScheduleConflict`\\n- `ResolvedSchedule`\\n\\nciteturn5view0\\n\\n这里我反而**不建议大改**。\\n\\n原因是你现在的“大型考试 + 周测”调度体系已经比较成熟。\\n\\n### 2.8 应该做的是：\\n\\n在现有：\\n\\n```text\\nMajorExam\\nExamItem\\nWeeklyPlan\\n```\\n\\n基础上增加**考试生命周期相关类型**。\\n\\n比如：\\n\\n```text\\nExamStatus\\n```\\n\\n而不是推翻现在的 `MajorExam`。\\n\\n---\\n\\n# ③ `AdminPage.tsx`\\n\\n这个是目前前端真正需要重点整理的地方。\\n\\n我已经看到它目前接近 **1000 行**，而且一个页面承担：\\n\\n- 管理员权限\\n- 初始化\\n- 大型考试\\n- 周测\\n- 班级\\n- 设备\\n- 用户\\n- Dashboard\\n- 设置\\n- 快速考试\\n- 公告\\n- PDF\\n- 数据同步\\n\\nciteturn3view2turn5view1\\n\\n这其实就是你未来考试功能继续增长以后最容易出问题的地方。\\n\\n---\\n\\n# ④ `ExamPage.tsx`\\n\\n这个页面目前大约 **600 行**，但它的职责其实比较合理。\\n\\n它主要还是：\\n\\n\u003e **大屏展示端**\\n\\n里面已经有：\\n\\n- 全屏\\n- Wake Lock\\n- 设计切换\\n- 考试显示\\n- 公告\\n- 同步状态\\n- 考试结束\\n- 移动端提示\\n\\nciteturn5view2\\n\\n### 所以这里不要大规模重构。\\n\\n你的定位仍然是：\\n\\n\u003e **显示端保持简单。**\\n\\n考试管理功能不要塞进 `ExamPage.tsx`。\\n\\n---\\n\\n# ⑤ `api/exams.ts`\\n\\n这个文件目前只有 **133 行左右**。\\n\\n这其实是一个好消息。\\n\\n它现在已经是：\\n\\n```text\\nHTTP入口\\n ↓\\naction判断\\n ↓\\nroute handler\\n```\\n\\n然后交给：\\n\\n```text\\nexamDataRoutes\\npluginRoutes\\ndeviceAdminRoutes\\ndeviceSelfRoutes\\nsettingsRoutes\\ndashboardRoutes\\n```\\n\\nciteturn4view3\\n\\n**所以这个文件暂时不要动架构。**\\n\\n未来只需要往里面增加：\\n\\n```text\\nexamControlRoutes\\nexamHistoryRoutes\\nexamLogRoutes\\n```\\n\\n而不是把逻辑重新塞回 `api/exams.ts`。\\n\\n---\\n\\n# ⑥ `api/_exams/routes/examDataRoutes.ts`\\n\\n这个文件目前约 **287 行**。\\n\\n这里才是我下一步要重点继续看的。\\n\\n因为现在你的考试保存，本质上仍然是：\\n\\n```text\\nExamBoardData\\n    ↓\\nexam_data\\n    ↓\\n整体保存 / diff\\n```\\n\\n而我们未来要做：\\n\\n```text\\n考试A\\n考试B\\n考试C\\n考试D\\n```\\n\\n以及：\\n\\n```text\\n进行中\\n待开始\\n历史考试\\n` \\n\\n---\\n\\n### 第 6 步：最后再做考试控制\\n\\n因为：\\n\\n```text\\n考试状态\\n ↓\\n考试控制\\n ↓\\n设备发布\\n```\\n\\n必须建立在前面的数据模型上。\\n\\n---\\n\\n# 还有一个很重要的结论\\n\\n我现在实际看完仓库之后，反而认为：\\n\\n**你的 2.7.3 基础比我们前面讨论时想象的要完整。**\\n\\n特别是：\\n\\n- `examService`\\n- `examOutbox`\\n- `temporaryExam`\\n- ETag\\n- 云端快照\\n- 冲突检测\\n- 权限体系\\n- ClassIsland 插件\\n- 设备绑定\\n- Device Heartbeat\\n- Dashboard\\n- 后端 `_exams` 解耦\\n\\n这些已经存在。citeturn3view0turn3view4turn4view3\\n\\n所以你现在**不应该大重构**。\\n\\n应该是：\\n\\n\u003e **在 2.7.3 的基础上做增量架构升级。**\\n\\n---\\n\\n## 下一步我建议直接继续往下查\\n\\n我已经查到这里了，下一步最关键的是继续读取：\\n\\n```text\\napi/_exams/db.ts\\napi/_exams/payload.ts\\napi/_exams/routes/examDataRoutes.ts\\napi/_exams/dashboard.ts\\nsrc/types/index.ts\\nsrc/components/里与大型考试有关的组件\\nAdminPage.tsx 中 major 相关部分\\n```\\n\\n然后我就可以给你真正精确到：\\n\\n\u003e **“这个文件第几类代码保留，这个函数修改，新增哪个文件，数据库新增什么字段/表，哪些旧代码不要动。”**\\n\\n这才是你现在从 **2.7.3 开发 2.8.0** 最实际的做法。\",{\"_928\":929},{\"_192\":1424,\"_199\":1805,\"_54\":1806,\"_203\":1807,\"_205\":206,\"_207\":14,\"_208\":209,\"_210\":1808,\"_212\":213},\"c09db926-e3e2-4ea9-a7f0-cbb9cf3449e1\",[1408],{\"_375\":376,\"_210\":1813},1787764428.671105,{\"_370\":947,\"_203\":1812},{\"_937\":938,\"_939\":685,\"_940\":1809,\"_942\":1810,\"_944\":945,\"_230\":231,\"_232\":1438,\"_234\":235,\"_236\":1439,\"_238\":1439,\"_225\":115,\"_239\":115,\"_71\":72,\"_240\":1811,\"_242\":14,\"_243\":1803,\"_244\":10},1787764416.331086,1787764428.6548367,[245],\"思考了 12s\",{},{\"_192\":1803,\"_199\":1817,\"_54\":1818,\"_203\":1819,\"_205\":206,\"_207\":14,\"_208\":209,\"_210\":1820,\"_212\":213},\"6235bbd2-b505-4527-9a38-035782170433\",[1424],{\"_375\":376,\"_210\":1834},1787764428.667065,{\"_370\":1017,\"_1017\":1829,\"_1019\":1830},{\"_957\":1821,\"_937\":959,\"_960\":961,\"_962\":1822,\"_940\":1809,\"_230\":231,\"_232\":1438,\"_234\":235,\"_236\":1439,\"_238\":1439,\"_225\":115,\"_239\":115,\"_71\":72,\"_240\":1823,\"_242\":14,\"_243\":1815,\"_244\":10},{\"_968\":1825},[1824,966],[245],\"https://www.google.com/s2/favico 83\",[245],{\"_192\":2443,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2442,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2441,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2440,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2439,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2438,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2437,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2436,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2435,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2434,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2433,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2432,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2431,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2430,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2429,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2428,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2427,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2426,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2425,\"_325\":14,\"_326\":14,\"_327\":-5},\"d19uq4\",\"zjk5pb\",\"z54392\",\"sckef0\",\"0iuyqx\",\"2hv99u\",\"vh8qu0\",\"eawnla\",\"g52h7m\",\"a7njhi\",\"q2fsf0\",\"i7o9y7\",\"dt6x8n\",\"50sz62\",\"60390j\",\"fdoq21\",\"1kbtaz\",\"wgl06w\",\"fiw0h7\",[369],[2446],\"如果你现在是准备从 **Novora 2.7.3 → 2.8**，我建议不要一上来大规模重构。应该围绕我们刚才确定的「考试管理 → 考试控制 → 历史考试 → 设备联动」把现有代码先整理成能继续扩展的结构。\\n\\n我建议重点整理下面 **8 类代码**。\\n\\n### 1. 考试数据模型 —— 最优先\\n\\n先检查目前考试相关的数据结构，把零散字段统一起来。\\n\\n建议最终至少有：\\n\\n```text\\nExam\\n├─ id\\n├─ name\\n├─ code\\n├─ description\\n├─ type\\n├─ status\\n├─ startTime\\n├─ endTime\\n├─ actualStartTime\\n├─ actualEndTime\\n├─ createdBy\\n├─ createdAt\\n├─ updatedAt\\n├─ archivedAt\\n└─ config\\n```\\n\\n其中 `status` 不要再由多个字段临时判断，而是统一状态：\\n\\n```text\\nDRAFT\\nPUBLISHED\\nWAITING\\nRUNNING\\nFINISHED\\nARCHIVED\\n```\\n\\n**这部分是 2.8 重构最重要的代码。**\\n\\n---\\n\\n### 2. 考试生命周期代码\\n\\n把现在可能散落在：\\n\\n- 创建考试\\n- 发布考试\\n- 定时任务\\n- 大屏页面\\n- 后端接口\\n- WebSocket\\n- 前端状态\\n\\n里的考试状态判断集中起来。\\n\\n最好形成统一的：\\n\\n```text\\nExamService\\n├─ createExam()\\n├─ updateExam()\\n├─ publishExam()\\n├─ startExam()\\n├─ pauseExam()\\n├─ resumeExam()\\n├─ extendExam()\\n├─ finishExam()\\n├─ archiveExam()\\n└─ duplicateExam()\\n```\\n\\n以后 2.9 的考试控制基本都从这里走。\\n\\n---\\n\\n### 3. 考试 API\\n\\n把目前考试 API 统一整理。\\n\\n建议形成：\\n\\n```text\\n/api/exams\\n```\\n\\n例如：\\n\\n```text\\nGET    /api/exams\\nPOST   /api/exams\\nGET    /api/exams/:id\\nPUT    /api/exams/:id\\nDELETE /api/exams/:id\\n\\nPOST   /api/exams/:id/publish\\nPOST   /api/exams/:id/start\\nPOST   /api/exams/:id/pause\\nPOST   /api/exams/:id/resume\\nPOST   /api/exams/:id/extend\\nPOST   /api/exams/:id/finish\\nPOST   /api/exams/:id/archive\\nPOST   /api/exams/:id/duplicate\\n```\\n\\n不用现在全部实现。\\n\\n**2.8 先把基础 CRUD 整理好，2.9 再增加控制接口。**\\n\\n---\\n\\n### 4. 考试前端页面\\n\\n把目前可能混在一起的考试 UI 拆开。\\n\\n建议：\\n\\n```text\\n考试管理\\n├─ ExamList\\n├─ ExamCard / ExamTable\\n├─ ExamFilter\\n├─ ExamCreate\\n├─ ExamEdit\\n├─ ExamDetail\\n└─ ExamStatus\\n```\\n\\n不要以后所有功能继续往一个考试页面里堆。\\n\\n---\\n\\n### 5. 考试显示端\\n\\n这一部分**不要大改 UI**，重点是把数据来源整理好。\\n\\n建议让显示端只关心：\\n\\n```text\\n当前考试\\n├─ 名称\\n├─ 开始时间\\n├─ 结束时间\\n├─ 当前状态\\n├─ 倒计时\\n├─ 公告\\n└─ 显示配置\\n```\\n\\n不要让大屏自己判断复杂业务。\\n\\n例如不要：\\n\\n```text\\nif xxx \u0026\u0026 xxx \u0026\u0026 time \u003e xxx ...\\n```\\n\\n到处自己计算考试状态。\\n\\n应该由后端/统一状态服务告诉它：\\n\\n```text\\nstatus: RUNNING\\nremainingTime: 3600\\n```\\n\\n这样未来 Agent、考试态势、手机端都可以使用同一套数据。\\n\\n---\\n\\n### 6. 考试与设备的关联代码\\n\\n这个现在就值得整理，因为后面的 Agent、楼控都依赖它。\\n\\n建议明确关系：\\n\\n```text\\nExam\\n ↓\\nBuilding\\n ↓\\nRoom\\n ↓\\nDevice\\n ↓\\nAgent\\n```\\n\\n考试不要直接把大量设备信息塞进考试对象里。\\n\\n更合理的是：\\n\\n```text\\nexam_rooms\\n```\\n\\n记录：\\n\\n```text\\nexamId\\nroomId\\n```\\n\\n然后：\\n\\n```text\\nroom\\n ↓\\ndevice\\n ↓\\nagent\\n```\\n\\n这样以后换设备，不需要修改考试本身。\\n\\n---\\n\\n### 7. 定时任务 / 倒计时代码\\n\\n这个也建议重点检查。\\n\\n比如：\\n\\n```text\\n考试开始\\n考试结束\\n自动结束\\n自动归档\\n```\\n\\n不要让前端 `setTimeout()` 成为真正的考试计时依据。\\n\\n应该：\\n\\n**服务器时间 + 考试时间 = 权威状态**\\n\\n前端只是显示：\\n\\n```text\\nserverTime\\nstartTime\\nendTime\\n```\\n\\n然后计算倒计时。\\n\\n这样即使：\\n\\n- 浏览器刷新\\n- 大屏重启\\n- 网络短暂中断\\n- Agent 重启\\n\\n考试时间仍然正确。\\n\\n---\\n\\n### 8. 日志代码\\n\\n2.8 就可以先把接口预留出来。\\n\\n建立统一的：\\n\\n```text\\nOperationLog\\n```\\n\\n例如：\\n\\n```text\\nid\\noperatorId\\noperatorName\\naction\\ntargetType\\ntargetId\\ndescription\\nresult\\ncreatedAt\\n```\\n\\n以后：\\n\\n```text\\n创建考试\\n修改考试\\n发布考试\\n开始考试\\n延长考试\\n结束考试\\n远程控制设备\\nAgent操作\\n```\\n\\n都可以走这一套。\\n\\n---\\n\\n# 最后是目录结构\\n\\n如果你现在的代码比较散，我建议最终逐渐整理成类似：\\n\\n```text\\nsrc/\\n├── modules/\\n│   ├── exams/\\n│   │   ├── exam.model\\n│   │   ├── exam.service\\n│   │   ├── exam.controller\\n│   │   ├── exam.repository\\n│   │   ├── exam.types\\n│   │   └── exam.validation\\n│   │\\n│   ├── rooms/\\n│   ├── devices/\\n│   ├── agents/\\n│   └── logs/\\n│\\n├── pages/\\n│   ├── exams/\\n│   │   ├── ExamList\\n│   │   ├── ExamDetail\\n│   │   ├── ExamCreate\\n│   │   └── ExamControl\\n│   │\\n│   ├── dashboard/\\n│   └── building/\\n│\\n├── services/\\n│   ├── websocket\\n│   ├── scheduler\\n│   └── realtime\\n│\\n└── shared/\\n    ├── types\\n    ├── utils\\n    └── constants\\n```\\n\\n**但这里有一个关键问题：我现在不知道你 2.7.3 的实际代码结构。**\\n\\n如果你希望我直接告诉你：\\n\\n\u003e **“哪些现有文件必须改、哪些文件新增、哪些代码删除/迁移、数据库具体改哪些字段”**\\n\\n那就应该直接以你的 **Novora 2.7.3 仓库代码**为准，而不是继续猜架构。你可以把仓库/项目文件上传给我，我可以按现有代码给你做一份 **2.7.3 → 2.8 的逐文件改造清单**。\",{},{\"_192\":2390,\"_199\":2451,\"_54\":2452,\"_56\":2453,\"_203\":2454,\"_205\":206,\"_208\":209,\"_210\":2455,\"_212\":213},\"38690805-b840-4af4-9612-0d6671698104\",[2374],{\"_375\":403,\"_210\":2463},1787764299.615501,1787764310.505378,{\"_370\":371,\"_372\":2461},{\"_239\":72,\"_71\":72,\"_386\":14,\"_228\":2456,\"_388\":2457,\"_390\":2458,\"_392\":14,\"_393\":2459,\"_395\":14,\"_396\":14,\"_397\":14,\"_398\":2460,\"_232\":2403,\"_400\":-5,\"_236\":2404,\"_238\":2404,\"_244\":10,\"_242\":14},[],[],[],[],{},[2462],\"整理都要整理哪些代码\",{},{\"_192\":2449,\"_199\":2467,\"_54\":2468,\"_56\":2469,\"_203\":2470,\"_205\":206,\"_207\":34,\"_208\":209,\"_210\":2471,\"_212\":213,\"_214\ ":2574,\"_47\":-5,\"_766\":-5,\"_50\":2575,\"_2576\":14},\"memcite\",6422,6431,[],[],\"hidden\",\"invalid\",[369],[2579],\"可以。结合你目前 **Novora 2.7.3 的定位**——核心仍然是「大屏时钟/考试显示工具」，同时已经开始具备考试发布、设备管理、楼控、考试态势、Agent 等方向——我建议不要一下子冲“大型考试平台”，而是按照**考试基础能力 → 设备联动 → 运维能力 → Agent → 楼控商业化 → 平台化**逐步推进。\\n\\n下面这套路线更适合你实际开发。\\n\\n---\\n\\n# Novora 后续版本开发路线\\n\\n## 总体路线\\n\\n```text\\n2.7.3\\n │\\n ├─ 第一阶段：考试功能完善\\n │\\n ▼\\n2.8.x\\n │  考试管理基础重构\\n │\\n ▼\\n2.9.x\\n │  考试控制 + 历史考试 + 发布体系\\n │\\n ▼\\n3.0.x\\n │  考试态势 + 设备联动\\n │\\n ▼\\n3.1.x\\n │  Agent\\n │\\n ▼\\n3.2.x\\n │  楼控中心\\n │\\n ▼\\n3.3.x\\n │  楼控运维 + 审计\\n │\\n ▼\\n4.0\\n    Novora 综合考试/楼控平台\\n```\\n\\n这里的版本号不是死规定，你完全可以根据实际开发量把 `2.8.1 / 2.8.2` 等作为修复版本。\\n\\n---\\n\\n# 第一阶段：考试功能完善\\n\\n## 2.8 —— 考试管理基础版\\n\\n### 核心目标\\n\\n把目前的：\\n\\n\u003e “创建一个考试 → 发布”\\n\\n升级成：\\n\\n\u003e **完整考试管理。**\\n\\n这一版是我认为你目前最应该做的。\\n\\n---\\n\\n## 2.8.0：考试管理中心\\n\\n新增独立的：\\n\\n**考试管理**\\n\\n### 页面\\n\\n```text\\n考试管理\\n\\n全部       草稿       待开始       进行中       已结束\\n\\n搜索考试\\n[考试名称 / 编号]\\n\\n时间 ▼\\n状态 ▼\\n创建人 ▼\\n```\\n\\n考试卡片/表格显示：\\n\\n- 考试名称\\n- 考试编号\\n- 考试时间\\n- 当前状态\\n- 教室数量\\n- 设备状态\\n- 创建时间\\n- 创建人\\n- 操作\\n\\n操作：\\n\\n```text\\n查看\\n编辑\\n发布\\n复制\\n删除\\n```\\n\\n---\\n\\n## 2.8.1：考试状态系统\\n\\n建立统一状态机：\\n\\n```text\\nDRAFT\\n ↓\\nPUBLISHED\\n ↓\\nWAITING\\n ↓\\nRUNNING\\n ↓\\nFINISHED\\n ↓\\nARCHIVED\\n```\\n\\n同时增加状态转换限制。\\n\\n例如：\\n\\n```text\\n草稿 → 可以编辑\\n\\n已发布 → 部分配置锁定\\n\\n进行中 → 禁止修改核心考试信息\\n\\n已结束 → 进入历史\\n\\n历史 → 不允许直接修改\\n```\\n\\n这个非常重要。\\n\\n以后所有功能都依赖这个状态体系。\\n\\n---\\n\\n# 2.8.2：考试创建/编辑重构\\n\\n重新整理创建考试页面。\\n\\n### 第一部分：基础信息\\n\\n```text\\n考试名称\\n考试编号\\n考试类型\\n备注\\n```\\n\\n### 第二部分：时间\\n\\n```text\\n考试日期\\n开始时间\\n结束时间\\n\\n允许延时：✓\\n默认延时：10 分钟\\n```\\n\\n### 第三部分：考试显示\\n\\n```text\\n显示考试名称 ✓\\n显示当前时间 ✓\\n显示倒计时 ✓\\n显示公告 ✓\\n结束提示 ✓\\n```\\n\\n### 第四部分：设备范围\\n\\n```text\\n教学楼\\n  ├─ A栋\\n  │   ├─ 301\\n  │   ├─ 302\\n  │   └─ 303\\n  └─ B栋\\n      ├─ 401\\n      └─ 402\\n```\\n\\n---\\n\\n# 2.8.3：考试详情页\\n\\n每场考试拥有自己的详情页。\\n\\n```text\\n考试详情\\n\\n2026 秋季期中考试\\n\\n状态：待开始\\n\\n考试时间\\n2026-09-15\\n09:00 - 11:00\\n\\n考试范围\\nA栋 12个教室\\n\\n设备\\n在线 11\\n离线 1\\n\\n显示配置\\n倒计时\\n当前时间\\n公告\\n\\n[编辑]\\n[发布]\\n[考试控制]\\n[查看日志]\\n```\\n\\n---\\n\\n# 2.8.4：考试复制\\n\\n加入：\\n\\n**复制考试**\\n\\n例如：\\n\\n```text\\n2026 春季期中考试\\n        ↓\\n复制\\n        ↓\\n2026 秋季期中考试\\n```\\n\\n复制配置：\\n\\n- 显示配置\\n- 教室\\n- 设备\\n- 考试规则\\n\\n不复制：\\n\\n- 状态\\n- 日志\\n- 发布记录\\n- 实际时间\\n\\n---\\n\\n# 2.8.5：搜索和筛选\\n\\n考试数量一多，这个功能就非常重要。\\n\\n支持：\\n\\n- 名称\\n- 编号\\n- 状态\\n- 日期\\n- 创建人\\n- 考试类型\\n\\n并支持：\\n\\n```text\\n最近创建\\n最近开始\\n最近结束\\n```\\n\\n---\\n\\n# 2.9 —— 考试运行与历史系统\\n\\n2.8解决：\\n\\n\u003e **“怎么管理考试。”**\\n\\n2.9解决：\\n\\n\u003e **“怎么运行考试。”**\\n\\n---\\n\\n# 2.9.0：考试发布系统\\n\\n发布考试之前进行检查：\\n\\n```text\\n发布检查\\n\\n✓ 时间配置\\n✓ 显示配置\\n✓ 教室配置\\n\\n设备状态：\\n\\n301 ✓\\n302 ✓\\n303 ⚠ 离线\\n304 ✓\\n\\n11 / 12 在线\\n```\\n\\n允许：\\n\\n```text\\n[取消发布]\\n[继续发布]\\n```\\n\\n---\\n\\n# 2.9.1：考试控制中心\\n\\n新增：\\n\\n**考试控制**\\n\\n核心操作：\\n\\n```text\\n开始考试\\n暂停\\n继续\\n延长 5 分钟\\n延长 10 分钟\\n发送公告\\n结束考试\\n```\\n\\n注意：\\n\\n**考试控制 ≠ 楼控中心。**\\n\\n考试控制控制的是：\\n\\n\u003e 一场考试。\\n\\n楼控控制的是：\\n\\n\u003e 一台/一组设备。\\n\\n---\\n\\n# 2.9.2：考试公告\\n\\n增加考试过程中向大屏发送消息。\\n\\n例如：\\n\\n```text\\n考试公告\\n\\n请考生注意：\\n\\n距离考试结束还有30分钟。\\n\\n[发送]\\n```\\n\\n后续可以扩展：\\n\\n- 全部教室\\n- 指定教室\\n- 指定楼栋\\n\\n---\\n\\n# 2.9.3：延时机制\\n\\n考试运行过程中：\\n\\n```text\\n原结束时间\\n11:00\\n\\n延长10分钟\\n\\n新结束时间\\n11:10\\n```\\n\\n同时记录：\\n\\n```text\\n09:42\\n管理员 Pikachu\\n延长考试 10 分钟\\n```\\n\\n---\\n\\n# 2.9.4：历史考试\\n\\n新增：\\n\\n**历史考试**\\n\\n自动归档：\\n\\n```text\\n进行中\\n ↓\\n结束\\n ↓\\n已结束\\n ↓\\n历史考试\\n```\\n\\n历史考试可以：\\n\\n- 查看\\n- 搜索\\n- 查看配置\\n- 查看日志\\n- 复制\\n\\n不能直接：\\n\\n- 修改\\n- 重新运行\\n\\n---\\n\\n# 2.9.5：考试操作日志\\n\\n统一记录：\\n\\n```text\\n创建\\n修改\\n发布\\n撤回\\n开始\\n暂停\\n继续\\n延长\\n发送公告\\n结束\\n归档\\n```\\n\\n以后 Agent 和楼控都可以共用这个日志系统。\\n\\n---\\n\\n# 3.0 —— 考试态势 + 设备联动\\n\\n这一版开始把你之前设计的：\\n\\n**考试态势**\\n\\n真正做起来。\\n\\n---\\n\\n## 3.0.0：考试态势首页\\n\\n定位：\\n\\n\u003e **看考试整体情况，而不是管理考试。**\\n\\n例如：\\n\\n```text\\n考试态势\\n\\n当前考试\\n3\\n\\n进行中\\n2\\n\\n待开始\\n1\\n\\n今日考试\\n8\\n\\n────────────────\\n\\n正在进行\\n\\n秋季期中考试\\n12间教室\\n11台设备正常\\n1台异常\\n\\n英语等级考试\\n24间教室\\n24台正常\\n```\\n\\n---\\n\\n## 3.0.1：设备状态概览\\n\\n考试态势显示：\\n\\n```text\\n设备总数\\n48\\n\\n在线\\n46\\n\\n离线\\n2\\n\\n异常\\n1\\n```\\n\\n但是这里只显示：\\n\\n\u003e **概览**\\n\\n不要把楼控中心的详细控制搬过来。\\n\\n---\\n\\n# 3.0.2：考试与设备关系\\n\\n建立：\\n\\n```text\\n考试\\n ↓\\n教学楼\\n ↓\\n教室\\n ↓\\n设备\\n```\\n\\n例如：\\n\\n```text\\n秋季期中考试\\n│\\n├─ A栋\\n│   ├─ 301\\n│   │   └─ Novora Display\\n│   └─ 302\\n│       └─ Novora Display\\n│\\n└─ B栋\\n    └─ 401\\n        └─ Novora Display\\n```\\n\\n这是未来整个系统非常关键的数据关系。\\n\\n---\\n\\n# 3.0.3：异常联动\\n\\n例如：\\n\\n```text\\n考试正在进行\\n\\nA栋 303\\n设备离线\\n```\\n\\n考试态势显示：\\n\\n\u003e ⚠ A栋303设备异常\\n\\n点击后：\\n\\n**进入楼控中心 → 定位到303设备**\\n\\n这样两个系统就真正联动起来了。\\n\\n---\\n\\n# 3.0.4：考试大屏增强\\n\\n把考试显示端继续增强。\\n\\n可以加入：\\n\\n- 当前时间\\n- 考试名称\\n- 倒计时\\n- 开始提示\\n- 结束提示\\n- 公告\\n- 网络状态\\n- 服务状态\\n\\n但仍然保持：\\n\\n\u003e **简洁的大屏工具**\\n\\n不要变成学生端考试系统。\\n\\n---\\n\\n# 3.1 —— Agent\\n\\n这一版才正式做 Agent。\\n\\n因为前面的 API、考试状态、设备关系、日志都已经成熟。\\n\\n---\\n\\n# 3.1.0：本地 Agent\\n\\n目标平台：\\n\\n- Windows\\n- Linux\\n\\nAgent 负责：\\n\\n```text\\nNovora Server\\n       ↓\\n     Agent\\n       ↓\\n本地浏览器 / 大屏 / 设备\\n```\\n\\n---\\n\\n# 3.1.1：Agent 心跳\\n\\nAgent 定期发送：\\n\\n```text\\nAgent ID\\n设备 ID\\n版本\\n系统\\nCPU\\n内存\\n网络\\n运行状态\\n```\\n\\n服务端知道：\\n\\n\u003e 哪台电脑还活着。\\n\\n---\\n\\n# 3.1.2：远程命令\\n\\n支持：\\n\\n```text\\n启动 Novora\\n停止 Novora\\n刷新页面\\n重新加载考试\\n发送消息\\n更新配置\\n```\\n\\n以后再逐步增加更多能力。\\n\\n---\\n\\n# 3.1.3：Agent 自动更新\\n\\n后期支持：\\n\\n```text\\n当前版本\\n2.8.0\\n\\n最新版本\\n2.8.3\\n\\n[更新]\\n```\\n\\n但这个功能可以晚一点做。\\n\\n---\\n\\n# 3.1.4：Agent 日志\\n\\n例如：\\n\\n```text\\nAgent启动\\n连接服务器\\n收到考试配置\\n启动考试\\n网络断开\\n重新连接\\n```\\n\\n这对于你后面排查学校环境问题非常重要。\\n\\n---\\n\\n# 3.2 —— 楼控中心正式版\\n\\n这时候开始进入你之前规划的：\\n\\n**教学楼视角数据大屏 + 远程控制。**\\n\\n---\\n\\n## 3.2.0：教学楼总览\\n\\n例如：\\n\\n```text\\n教学楼\\n\\nA栋\\n教室 36\\n\\n设备\\n36\\n\\n在线\\n34\\n\\n异常\\n2\\n```\\n\\n---\\n\\n# 3.2.1：楼栋视图\\n\\n```text\\nA栋\\n\\n3F\\n301 ✓\\n302 ✓\\n303 ⚠\\n304 ✓\\n\\n4F\\n401 ✓\\n402 ✓\\n403 ✓\\n404 ×\\n```\\n\\n一页控制有限数量设备。\\n\\n你之前提出的：\\n\\n\u003e 不要一个页面塞太多设备。\\n\\n这里就保持。\\n\\n---\\n\\n# 3.2.2：教室详情\\n\\n进入一个教室：\\n\\n```text\\nA栋 303\\n\\n状态：异常\\n\\nNovora\\n在线\\n\\n网络\\n异常\\n\\n考试\\n2026秋季期中考试\\n\\n[刷新]\\n[重启]\\n[发送消息]\\n[结束显示]\\n```\\n\\n---\\n\\n# 3.2.3：设备远程控制\\n\\n逐步增加：\\n\\n- 启动\\n- 重启\\n- 刷新\\n- 发送信息\\n- 发布考试\\n- 结束考试\\n- 获取状态\\n\\n---\\n\\n# 3.3 —— 楼控运维版\\n\\n这一版开始考虑你之前提到的：\\n\\n\u003e **楼控功能以后可能做成收费功能。**\\n\\n---\\n\\n## 3.3.0：设备管理增强\\n\\n增加：\\n\\n- 设备编号\\n- 安装位置\\n- Agent版本\\n- 最后在线时间\\n- IP\\n- 系统\\n- 运行状态\\n\\n---\\n\\n# 3.3.1：远程操作日志\\n\\n例如：\\n\\n```text\\n管理员\\n↓\\n重启 A栋303\\n↓\\nAgent\\n↓\\n执行成功\\n```\\n\\n记录：\\n\\n```text\\n操作者\\n时间\\n设备\\n操作\\n结果\\n错误信息\\n```\\n\\n---\\n\\n# 3.3.2：内测管理\\n\\n这就是你之前提到的需求。\\n\\n作者可以：\\n\\n```text\\n内测设备\\n\\nA栋303\\nA栋304\\nB栋401\\n\\n[进入内测]\\n```\\n\\n服务器记录：\\n\\n```text\\n测试开始\\n测试人员\\n测试设备\\n调用次数\\n操作日志\\n```\\n\\n作者可以：\\n\\n**远程结束内测。**\\n\\n这为未来收费功能打基础。\\n\\n---\\n\\n# 3.3.3：权限系统\\n\\n开始加入：\\n\\n```text\\n超级管理员\\n管理员\\n考试管理员\\n设备管理员\\n只读用户\\n```\\n\\n但不要过早做复杂 RBAC。\\n\\n3.3 做基础角色就够。\\n\\n---\\n\\n# 3.4 —— 商业化基础\\n\\n这一版才开始考虑：\\n\\n\u003e **Novora 能不能成为一个真正可部署的产品。**\\n\\n---\\n\\n## 3.4.0：组织/租户\\n\\n例如：\\n\\n```text\\n学校A\\n ├─ 教学楼A\\n ├─ 教学楼B\\n └─ 设备\\n\\n学校B\\n ├─ 教学楼A\\n └─ 设备\\n```\\n\\n这样才有 SaaS / 商业化基础。\\n\\n---\\n\\n## 3.4.1：授权系统\\n\\n可以考虑：\\n\\n```text\\n基础版\\n专业版\\n楼控版\\n```\\n\\n楼控功能成为独立授权模块。\\n\\n---\\n\\n## 3.4.2：授权设备数量\\n\\n例如：\\n\\n```text\\n授权设备\\n\\n20 / 50\\n```\\n\\n超过数量：\\n\\n\u003e 无法继续绑定新设备。\\n\\n---\\n\\n# 4.0 —— Novora 平台化\\n\\n到了这里再考虑“大型考试平台”。\\n\\n不是做传统教务系统，而是形成你自己的特色：\\n\\n```text\\nNovora\\n│\\n├── 考试管理\\n│\\n├── 考试态势\\n│\\n├── 大屏显示\\n│\\n├── 教学楼\\n│\\n├── 楼控中心\\n│\\n├── Agent\\n│\\n├── 设备管理\\n│\\n├── 操作日志\\n│\\n└── API / Agent\\n```\\n\\n这时候你和普通的：\\n\\n\u003e 在线考试系统\\n\\n已经完全不是一个赛道。\\n\\n---\\n\\n# 我建议你的实际开发顺序\\n\\n如果考虑**一个人/小团队实际开发能力**，不要严格按照“大版本一次全部完成”。\\n\\n建议：\\n\\n```text\\n现在\\n2.7.3\\n│\\n│  整理现有考试代码\\n▼\\n2.8.0\\n考试管理\\n│\\n├─ 列表\\n├─ 状态\\n├─ 创建/编辑\\n├─ 详情\\n└─ 搜索\\n│\\n▼\\n2.8.1\\n复制考试\\n发布检查\\n│\\n▼\\n2.8.2\\nBUG修复 / UI调整\\n│\\n▼\\n2.9.0\\n考试控制\\n│\\n├─ 开始\\n├─ 暂停\\n├─ 延时\\n├─ 公告\\n└─ 结束\\n│\\n▼\\n2.9.1\\n历史考试\\n│\\n▼\\n2.9.2\\n操作日志\\n│\\n▼\\n3.0.0\\n考试态势\\n│\\n▼\\n3.0.1\\n考试 ↔ 教室 ↔ 设备\\n│\\n▼\\n3.0.2\\n异常联动\\n│\\n▼\\n3.1.0\\nAgent\\n│\\n▼\\n3.1.x\\nAgent完善\\n│\\n▼\\n3.2.0\\n楼控中心\\n│\\n▼\\n3.2.x\\n远程控制\\n│\\n▼\\n3.3.x\\n楼控运维 / 内测\\n│\\n▼\\n3.4.x\\n商业化\\n│\\n▼\\n4.0\\n平台化\\n```\\n\\n## 最重要的一点\\n\\n**你现在不要急着做 3.x 的功能。**\\n\\n你当前最值得投入的是：\\n\\n\u003e **2.7.3 → 2.8 → 2.9**\\n\\n把考试这个核心链路打牢。\\n\\n因为后面的：\\n\\n**考试态势、Agent、楼控、远程发布、内测、商业化**\\n\\n实际上都建立在一个核心数据模型上：\\n\\n```text\\n考试\\n ↓\\n考试状态\\n ↓\\n考试时间\\n ↓\\n考试配置\\n ↓\\n教室\\n ↓\\n设备\\n ↓\\nAgent\\n ↓\\n操作日志\\n```\\n\\n如果这一层现在设计好，后面功能基本都是往上叠；如果现在考试模型做得比较散，等做到 Agent/楼控时再重构，会非常痛苦。\\n\\n**所以我会把 2.8～2.9 视为 Novora 下一阶段真正的“地基版本”，而不是简单的小版本更新。** memcite\",{},{\"_192\":2465,\"_199\":2584,\"_54\":2585,\"_203\":2586,\"_205\":206,\"_208\":209,\"_210\":2587,\"_212\":213},\"bbb21d9a-69ee-4bf3-9d58-d057e89f4db3\",[2449],{\"_375\":376,\"_210\":2590},1787764023.594258,{\"_370\":2588,\"_2589\":774},{\"_230\":231,\"_236\":2479,\"_238\":2479,\"_243\":2582,\"_244\":10,\"_1038\":34},\"model_editable_context\",\"model_set_context\",{},{\"_192\":2582,\"_199\":2594,\"_54\":2595,\"_56\":2596,\"_203\":2597,\"_205\":206,\"_208\":209,\"_210\":2598,\"_212\":213},\"3ec5a528-df94-4eda-94c1-e914b566a93f\",[2465],{\"_375\":403,\"_210\":2606},1787764023.412749,1787764048.28768,{\"_370\":371,\"_372\":2604},{\"_239\":72,\"_71\":72,\"_386\":14,\"_228\":2599,\"_388\":2600,\"_390\":2601,\"_392\":14,\"_393\":2602,\"_395\":14,\"_396\":14,\"_397\":14,\"_398\":2603,\"_232\":2478,\"_400\":-5,\"_236\":2479,\"_238\":2479,\"_244\":10,\"_242\":14},[],[],[],[],{},[2605],\"给我具体的开发路线，详细点，每个版本\",{},{\"_192\":2592,\"_199\":2610,\"_54\":2611,\"_56\":2612,\"_203\":2613,\"_205\":206,\"_207\":34,\"_208\":209,\"_210\":2614,\"_212\":213,\"_214\":215},\"1eb1a468-98dc-4ba7-8dc7-37e75e0bc8e0\",[2582],{\"_375\":376,\"_210\":2647},1787763119.530518,1787763138.891965,{\"_370\":371,\"_372\":2645},{\"_216\":2615,\"_218\":34,\"_219\":2616,\"_221\":2617,\"_223\":2618,\"_225\":115,\"_226\":2619,\"_228\":2620,\"_230\":231,\"_232\":2621,\"_234\":235,\"_236\":2622,\"_238\":2622,\"_239\":115,\"_71\":72,\"_240\":2623,\"_242\":34,\"_243\":2608,\"_244\":10},{\"_50\":366,\"_367\":2644},[],[],[],{\"_246\":2624,\"_248\":2625,\"_250\":2626,\"_252\":2627,\"_254\":2628,\"_256\":2629,\"_258\":2630,\"_260\":2631,\"_262\":2632,\"_264\":2633},[],\"f29ee13c-c8b4-4540-93b4-3094eb7654ed\",\"4d4fb05e-bffb-45b5-9a38-87ee086f4d91\",[245],{\"_192\":2643,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2642,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2641,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2640,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2639,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2638,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2637,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2636,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2635,\"_325\":14,\"_326\":14,\"_327\":-5},{\"_192\":2634,\"_325\":14,\"_326\":14,\"_327\":-5},\"awp8kh\",\"qcansn\",\"8wk51n\",\"t7awbm\",\"o4ljfp\",\"t5a410\",\"b1qoif\",\"17sdfb\",\"0tflqz\",\"n00itl\",[369],[2646],\"对。按照我们刚才梳理的**贴合 Novora 现状的未来规划**，第一阶段不应该直接去做“完整大型考试平台”，而应该先把你现在已经有的考试能力补齐，让它从“能发布考试的大屏时钟工具”变成一个**基础考试管理系统**。\\n\\n我建议第一阶段的目标定为：\\n\\n\u003e **考试功能完善：把现有「创建 → 发布 → 进行 → 结束」流程做完整，同时解决考试越来越多以后难管理的问题。**\\n\\n### 第一阶段需要新增 / 修改的功能\\n\\n| 模块 | 类型 | 第一阶段要做什么 | 优先级 |\\n|---|---|---|---|\\n| 考试管理 | 新增/重构 | 独立的考试管理首页 | ⭐⭐⭐⭐⭐ |\\n| 创建考试 | 修改 | 完善考试基本信息、时间、状态、设备范围 | ⭐⭐⭐⭐⭐ |\\n| 考试状态 | 新增 | 草稿、待开始、进行中、已结束、已归档 | ⭐⭐⭐⭐⭐ |\\n| 考试详情 | 新增 | 一个考试对应完整的详情页 | ⭐⭐⭐⭐⭐ |\\n| 考试发布 | 修改 | 发布前检查 + 发布记录 | ⭐⭐⭐⭐⭐ |\\n| 考试控制 | 修改 | 开始、暂停、继续、结束、延时 | ⭐⭐⭐⭐⭐ |\\n| 考试历史 | 新增 | 已结束考试进入历史考试 | ⭐⭐⭐⭐⭐ |\\n| 考试搜索/筛选 | 新增 | 按名称、时间、状态快速找考试 | ⭐⭐⭐⭐⭐ |\\n| 考试复制 | 新增 | 从历史考试/已有考试快速创建新考试 | ⭐⭐⭐⭐ |\\n| 考试模板 | 新增 | 常用考试配置保存为模板 | ⭐⭐⭐ |\\n| 考试设备 | 修改 | 明确考试与教室/设备的关联 | ⭐⭐⭐⭐⭐ |\\n| 发布记录 | 新增 | 谁、什么时候、向哪些设备发布 | ⭐⭐⭐⭐ |\\n| 操作日志 | 新增 | 开始/结束/延时/发布等操作留痕 | ⭐⭐⭐⭐ |\\n| 异常状态 | 新增 | 设备离线、发布失败等提示 | ⭐⭐⭐⭐ |\\n\\n---\\n\\n## 1. 先重做「考试管理」这一层\\n\\n你现在如果考试数量增加，最大的隐患其实不是功能少，而是：\\n\\n**考试会越来越多，最终全部堆在一个列表里。**\\n\\n所以第一阶段就应该建立：\\n\\n**考试管理**\\n\\n下面至少分成：\\n\\n- 全部考试\\n- 进行中\\n- 待开始\\n- 草稿\\n- 已结束\\n- 历史考试\\n\\n但我不建议把这些全部做成左侧栏。\\n\\n更适合你的方式是：\\n\\n```text\\n考试管理\\n\\n[全部] [草稿] [待开始] [进行中] [已结束]\\n\\n搜索考试……\\n时间范围 ▼    考试状态 ▼\\n\\n┌─────────────────────────────┐\\n│ 2026秋季期中考试             │\\n│ 09-15 09:00 ~ 11:00          │\\n│ 进行中                       │\\n│                             │\\n│ 12 个教室   设备在线 11/12   │\\n│                             │\\n│ [进入考试] [考试控制]        │\\n└─────────────────────────────┘\\n```\\n\\n这样未来考试达到几十、几百场，也不会乱。\\n\\n---\\n\\n# 2. 「创建考试」需要重新完善\\n\\n第一阶段我建议不要把创建考试做得特别复杂。\\n\\n先把核心字段确定下来：\\n\\n### 基础信息\\n\\n- 考试名称\\n- 考试编号\\n- 考试类型\\n- 考试说明\\n- 创建人\\n\\n### 时间\\n\\n- 考试日期\\n- 开始时间\\n- 结束时间\\n- 是否允许延时\\n- 延时时间\\n\\n### 考试环境\\n\\n- 使用哪些教学楼\\n- 使用哪些教室\\n- 使用哪些设备\\n- 是否自动发布\\n\\n### 显示配置\\n\\n这里就可以和你 Novora 的核心定位结合：\\n\\n- 考试倒计时\\n- 当前时间\\n- 考试名称\\n- 开考提示\\n- 结束提示\\n- 自定义公告\\n\\n这样创建出来的考试，本质上就是一个**考试运行配置**。\\n\\n---\\n\\n# 3. 增加完整的考试生命周期\\n\\n这是第一阶段最重要的改动之一。\\n\\n建议统一成：\\n\\n```text\\n草稿\\n ↓\\n待发布\\n ↓\\n已发布\\n ↓\\n待开始\\n ↓\\n进行中\\n ↓\\n已结束\\n ↓\\n历史考试\\n```\\n\\n其中：\\n\\n### 草稿\\n\\n可以随便修改。\\n\\n### 已发布\\n\\n配置已经发送到指定设备，但考试还没开始。\\n\\n### 待开始\\n\\n距离考试开始还有时间。\\n\\n### 进行中\\n\\n进入考试运行状态。\\n\\n### 已结束\\n\\n考试结束后的短期状态。\\n\\n### 历史考试\\n\\n长期保存，不再占用主要考试列表。\\n\\n---\\n\\n# 4. 「考试详情页」必须增加\\n\\n以后不要在列表里塞太多操作。\\n\\n点击考试之后进入：\\n\\n**考试详情**\\n\\n例如：\\n\\n```text\\n2026 秋季期中考试\\n\\n状态：进行中\\n────────────────\\n\\n考试时间\\n09:00 - 11:00\\n\\n当前状态\\n01:26:43\\n\\n考试设备\\n教学楼 A\\n├─ 301 ✓\\n├─ 302 ✓\\n├─ 303 ⚠\\n└─ 304 ✓\\n\\n────────────────\\n\\n考试配置\\n显示内容\\n倒计时\\n公告\\n结束提示\\n\\n────────────────\\n\\n操作\\n\\n[考试控制]\\n[修改考试]\\n[查看日志]\\n[结束考试]\\n```\\n\\n这样以后你增加功能也比较容易扩展。\\n\\n---\\n\\n# 5. 「考试控制」要独立出来\\n\\n这个功能和你之前设计的**楼控中心**要区分开。\\n\\n楼控中心负责：\\n\\n\u003e 设备层面的控制。\\n\\n考试控制负责：\\n\\n\u003e **考试层面的控制。**\\n\\n例如：\\n\\n```text\\n考试控制\\n\\n2026 秋季期中考试\\n状态：进行中\\n\\n剩余时间\\n01:26:43\\n\\n[暂停考试]\\n\\n[继续考试]\\n\\n[延长 5 分钟]\\n[延长 10 分钟]\\n\\n────────────\\n\\n[发送考试公告]\\n\\n[结束考试]\\n```\\n\\n这样以后即使你增加 Agent，也很好接入。\\n\\n例如：\\n\\n\u003e “将这场考试延长 10 分钟。”\\n\\nAgent 实际调用的就是考试控制接口。\\n\\n---\\n\\n# 6. 第一阶段必须增加「历史考试」\\n\\n这个就是你之前提到的需求，我认为应该直接放进第一阶段。\\n\\n不要简单理解成：\\n\\n\u003e 已结束 = 删除。\\n\\n而应该：\\n\\n```text\\n当前考试\\n    ↓\\n考试结束\\n    ↓\\n已结束\\n    ↓\\n归档\\n    ↓\\n历史考试\\n```\\n\\n历史考试保留：\\n\\n- 考试名称\\n- 时间\\n- 创建人\\n- 考试配置\\n- 使用教室\\n- 使用设备\\n- 发布记录\\n- 操作日志\\n\\n并提供：\\n\\n**「复制为新考试」**\\n\\n这个功能其实非常有价值。\\n\\n比如：\\n\\n\u003e 2026 春季期中考试\\n\\n结束后，下次可以直接：\\n\\n**复制 → 修改日期 → 修改名称 → 发布**\\n\\n而不是重新配置。\\n\\n---\\n\\n# 7. 增加「考试复制」\\n\\n这个功能成本很低，但实际使用价值很高。\\n\\n例如：\\n\\n```text\\n2026 春季期中考试\\n       ↓\\n    [复制]\\n       ↓\\n2026 秋季期中考试\\n```\\n\\n复制：\\n\\n- 考试显示配置\\n- 倒计时配置\\n- 公告配置\\n- 教室范围\\n- 设备范围\\n\\n不复制：\\n\\n- 考试状态\\n- 实际开始时间\\n- 实际结束时间\\n- 操作日志\\n- 发布记录\\n\\n---\\n\\n# 8. 考试发布功能要加强\\n\\n你现在已经有远程发布考试的基础，所以第一阶段重点不是重新做，而是**把发布过程规范化**。\\n\\n点击：\\n\\n**发布考试**\\n\\n先进行检查：\\n\\n```text\\n发布检查\\n\\n✓ 考试时间\\n✓ 考试配置\\n✓ 教室配置\\n\\n设备状态\\n\\n301   在线 ✓\\n302   在线 ✓\\n303   离线 ⚠\\n304   在线 ✓\\n\\n发现 1 台设备异常\\n\\n[取消发布]\\n[继续发布]\\n```\\n\\n发布以后记录：\\n\\n```text\\n发布记录\\n\\n08:45\\n管理员\\n发布考试\\n\\n目标：12 个教室\\n\\n成功：11\\n失败：1\\n```\\n\\n这对你以后做收费的楼控功能也很重要。\\n\\n---\\n\\n# 9. 第一阶段就加入「操作日志」\\n\\n不用一开始做得非常复杂。\\n\\n记录这些就够了：\\n\\n```text\\n08:45  管理员  发布考试\\n08:52  管理员  修改考试配置\\n09:00  系统    考试自动开始\\n09:30  管理员  延长 10 分钟\\n10:00  管理员  发送公告\\n11:00  系统    考试结束\\n```\\n\\n以后你做：\\n\\n- Agent\\n- 远程控制\\n- 多管理员\\n- 收费楼控\\n- 审计\\n\\n都会需要这个基础。\\n\\n---\\n\\n# 10. 增加「异常状态」\\n\\n第一阶段不需要做复杂监控，但至少要让考试管理员知道：\\n\\n**考试有没有正常下发。**\\n\\n例如：\\n\\n```text\\n考试状态\\n\\n12 个教室\\n\\n在线       11\\n离线        1\\n发布成功   11\\n发布失败    1\\n```\\n\\n然后点击异常设备，可以跳到楼控中心处理。\\n\\n这就形成：\\n\\n**考试管理 → 发现问题 → 楼控中心处理**\\n\\n两个系统不会互相抢功能。\\n\\n---\\n\\n# 11. 「考试态势」暂时不要塞太多管理功能\\n\\n这一点我特别建议你保持住。\\n\\n按照你前面说的：\\n\\n\u003e Novora 本质上还是大屏时钟显示工具。\\n\\n所以：\\n\\n### 考试管理\\n\\n负责：\\n\\n\u003e **管理考试**\\n\\n### 考试态势\\n\\n负责：\\n\\n\u003e **看考试整体状态**\\n\\n### 楼控中心\\n\\n负责：\\n\\n\u003e **管设备**\\n\\n三者不要混。\\n\\n例如：\\n\\n| 功能 | 考试管理 | 考试态势 | 楼控中心 |\\n|---|---|---|---|\\n| 创建考试 | ✅ | ❌ | ❌ |\\n| 修改考试 | ✅ | ❌ | ❌ |\\n| 发布考试 | ✅ | ❌ | ❌ |\\n| 开始/结束考试 | ✅ | ❌ | ❌ |\\n| 考试数量 | ✅ | ✅ | ❌ |\\n| 教室状态 | 简要 | 概览 | **详细** |\\n| 设备在线状态 | 简要 | 概览 | **详细** |\\n| 远程控制设备 | ❌ | ❌ | **✅** |\\n| 操作日志 | ✅ | ❌ | ✅ |\\n| 历史考试 | **✅** | ❌ | ❌ |\\n\\n这样产品结构会越来越清晰。\\n\\n---\\n\\n# 第一阶段最终可以收敛成这 6 个核心模块\\n\\n如果让我帮你控制开发量，我会把第一阶段压缩成：\\n\\n### P1-01 考试管理\\n- 考试列表\\n- 搜索\\n- 筛选\\n- 状态分类\\n\\n### P1-02 考试创建/编辑\\n- 基础信息\\n- 时间\\n- 显示配置\\n- 教室/设备范围\\n\\n### P1-03 考试生命周期\\n- 草稿\\n- 发布\\n- 待开始\\n- 进行中\\n- 已结束\\n- 归档\\n\\n### P1-04 考试控制\\n- 开始\\n- 暂停\\n- 继续\\n- 延长\\n- 公告\\n- 结束\\n\\n### P1-05 历史考试\\n- 历史列表\\n- 查看详情\\n- 恢复/复制\\n- 搜索\\n\\n### P1-06 发布与日志\\n- 发布检查\\n- 发布结果\\n- 设备异常\\n- 操作日志\\n\\n---\\n\\n## 我认为第一阶段暂时**不要做**的东西\\n\\n为了避免 Novora 过度膨胀，下面这些可以明确放到后面：\\n\\n- ❌ 考生管理\\n- ❌ 报名系统\\n- ❌ 题库\\n- ❌ 试卷管理\\n- ❌ 自动阅卷\\n- ❌ 成绩分析\\n- ❌ 排考算法\\n- ❌ 监考人员管理\\n- ❌ 大型考试组织架构\\n- ❌ 复杂权限体系\\n- ❌ OA/教务系统对接\\n\\n这些属于真正的**大型考试管理平台**方向，不应该在 2.7.x 这个阶段把 Novora 带偏。\\n\\n**所以第一阶段的核心不是“增加很多考试功能”，而是把你现有的考试能力整理成一套完整、可长期扩展的考试生命周期。**\\n\\n如果按你现在 **2.7.3 → 后续版本**来拆，我会建议下一步直接把这些内容细化成 **2.8、2.9、3.0 各版本具体要改哪些页面、接口和数据库字段**，这样就能直接变成你的实际开发路线。\",{},{\"_192\":2608,\"_199\":2651,\"_54\":2652,\"_203\":2653,\"_205\":206,\"_208\":209,\"_210\":2654,\"_212\":213},\"dec9b29f-fac7-4642-afbb-9941779056f3\",[2592],{\"_375\":376,\"_210\":2655},1787763119.5337186,{\"_370\":2588,\"_2589\":774},{\"_230\":231,\"_236\":2622,\"_238\":2622,\"_243\":2649,\"_244\":10,\"_1038\":34},{},{\"_192\":2649,\"_199\":2659,\"_54\":2660,\"_203\":2661,\"_205\":206,\"_207\":34,\"_208\":604,\"_210\":2662,\"_212\":213},\"06d7cf2f-c2a3-46cd-98d5-24cdfb912ba4\",[2608],{\"_375\":1229,\"_210\":2667},1787763120.127224,{\"_370\":371,\"_372\":2666},{
