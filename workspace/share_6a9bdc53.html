qce1\",\"l01sx6\",\"dndjyp\",\"mwiquk\",\"g6tswx\",\"rghq1q\",\"fqx9l9\",\"j6perm\",\"g17vq6\",\"f32kol\",\"jg9pvy\",\"biqinl\",\"ynyudk\",\"uypz62\",\"gvq97q\",\"fwwxkz\",\"fe3cr2\",\"ln7r3k\",\"jf0jo9\",\"zsyc7x\",\"pgvhhz\",\"kd8jyg\",\"5k4wvy\",\"4usmla\",\"1gi5he\",\"yq6x76\",\"5oo94g\",\"rhm0sk\",\"lxx3ia\",\"jfhsfj\",\"1x1gho\",\"0gfyky\",\"3rso4a\",\"tm8abj\",\"ly4c8u\",\"nyjqrn\",\"gap0rn\",\"1umg3c\",\"73ef7o\",\"xjo2wc\",\"uy9bcp\",\"e7aoha\",\"ryfakt\",\"nv9w26\",\"t24msi\",\"bi17ea\",\"w95z9o\",\"ccdpxx\",\"hw5bnv\",\"1pcc2j\",\"5ouwlu\",\"ko5o8h\",\"vcoyaf\",\"5tuv4x\",\"9idlwa\",\"2bloxv\",\"87fkhm\",\"7z2lv6\",\"9w27p2\",\"0bc9pi\",\"14bm7c\",\"241jzg\",\"my2b94\",\"0y7d5e\",\"7dlmk4\",\"7sbydy\",\"tuxytd\",\"8ll0tx\",\"vfql4i\",\"54wl07\",\"j6j4bc\",\"qlbh3z\",\"dm7tcq\",\"kk8yxg\",\"aljksu\",\"d62r24\",\"o4dq87\",\"di8wk3\",\"fn98rg\",\"1u978c\",\"67fzdt\",\"b6gebn\",\"1vqai0\",\"us5tfa\",\"p6s6qs\",\"kkg5e2\",\"bgx5su\",\"7e9o51\",\"idywfv\",\"5jmj69\",\"c7rh0i\",\"gdsn27\",\"r93m4e\",\"d0zef1\",\"w7qa4h\",\"vfh3k1\",\"ebizf3\",\"9kyvyo\",\"cxaqy8\",\"r590xl\",\"tn6krh\",\"z0rgn1\",[759],[2329],\"可以。按照你现在 Novora 的架构，我建议不要把 WebSocket 设计成“简单推送消息”，而是直接设计成一套**客户端实时控制协议**。\\n\\n核心目标：\\n\\n\u003e **WebSocket 负责实时，HTTP 负责初始化/兜底，数据库负责最终状态。**\\n\\n这样即使学校网络抖动、浏览器刷新、WebSocket 断开，客户端也不会出现“命令丢了、状态乱了、设备失联却显示在线”的问题。\\n\\n---\\n\\n# Novora Client WebSocket Protocol v1\\n\\n建议协议名称：\\n\\n```text\\nNovora Client Realtime Protocol\\nNCRP/1\\n```\\n\\n整体架构：\\n\\n```text\\n                 ┌──────────────────────┐\\n                 │     学校服务端        │\\n                 │                      │\\n                 │  REST API            │\\n                 │  WebSocket Server    │\\n                 │  PostgreSQL          │\\n                 └──────────┬───────────┘\\n                            │\\n                     WebSocket\\n                            │\\n              ┌─────────────┼─────────────┐\\n              │             │             │\\n              ▼             ▼             ▼\\n          Client-001    Client-002    Client-003\\n              │\\n              │\\n          Novora Agent\\n              │\\n              ▼\\n          浏览器客户端\\n```\\n\\n---\\n\\n# 一、连接生命周期\\n\\n客户端启动以后，不要直接认为“WebSocket连接成功 = 客户端正常”。\\n\\n应该有完整状态机：\\n\\n```text\\nOFFLINE\\n   │\\n   ▼\\nCONNECTING\\n   │\\n   ├────失败────→ RECONNECT_WAIT\\n   │                    │\\n   │                    └────→ CONNECTING\\n   │\\n   ▼\\nAUTHENTICATING\\n   │\\n   ├────失败────→ AUTH_FAILED\\n   │\\n   ▼\\nREGISTERING\\n   │\\n   ▼\\nSYNCING\\n   │\\n   ▼\\nONLINE\\n```\\n\\n断线：\\n\\n```text\\nONLINE\\n  │\\n  ▼\\nDISCONNECTED\\n  │\\n  ▼\\nRECONNECT_WAIT\\n  │\\n  ▼\\nCONNECTING\\n```\\n\\n这样作者端以后可以明确看到：\\n\\n```text\\n在线\\n连接中\\n离线\\n认证失败\\n版本过低\\n服务端拒绝\\n```\\n\\n而不是简单的：\\n\\n```text\\n在线 / 不在线\\n```\\n\\n---\\n\\n# 二、WebSocket 地址\\n\\n推荐：\\n\\n```text\\nwss://school-server.example.com/ws/client\\n```\\n\\n而不是：\\n\\n```text\\nwss://school-server.example.com/\\n```\\n\\n以后可以扩展：\\n\\n```text\\n/ws/client\\n/ws/agent\\n/ws/admin\\n/ws/internal\\n```\\n\\n客户端协议版本通过参数或者 Header：\\n\\n```text\\nwss://school-server.example.com/ws/client?protocol=1\\n```\\n\\n不过**不要把鉴权 Token 放 URL**。\\n\\n---\\n\\n# 三、客户端身份\\n\\n每一台客户端必须拥有一个永久的：\\n\\n```text\\nclient_id\\n```\\n\\n例如：\\n\\n```text\\nclt_01JZ7K8A3F9P2X...\\n```\\n\\n注意：\\n\\n**client_id 不应该每次启动随机生成。**\\n\\n否则：\\n\\n```text\\n电脑A\\n↓\\nclient_id = abc\\n```\\n\\n重装/刷新后：\\n\\n```text\\nclient_id = xyz\\n```\\n\\n服务器就会认为是新设备。\\n\\n---\\n\\n# 四、设备注册\\n\\n首次打开 Novora Client：\\n\\n```text\\n客户端\\n   │\\n   │ POST /api/client/register\\n   ▼\\n学校服务端\\n```\\n\\n客户端提交：\\n\\n```json\\n{\\n  \\\"device_name\\\": \\\"高一1班教室大屏\\\",\\n  \\\"device_type\\\": \\\"classroom_display\\\",\\n  \\\"client_version\\\": \\\"2.8.0\\\",\\n  \\\"platform\\\": \\\"web\\\",\\n  \\\"browser\\\": \\\"Chrome\\\",\\n  \\\"screen\\\": {\\n    \\\"width\\\": 1920,\\n    \\\"height\\\": 1080,\\n    \\\"device_pixel_ratio\\\": 1\\n  }\\n}\\n```\\n\\n服务器返回：\\n\\n```json\\n{\\n  \\\"client_id\\\": \\\"clt_xxxxx\\\",\\n  \\\"device_token\\\": \\\"xxxxx\\\",\\n  \\\"server_id\\\": \\\"school_xxxxx\\\",\\n  \\\"protocol_version\\\": 1\\n}\\n```\\n\\n客户端本地保存：\\n\\n```text\\nclient_id\\ndevice_token\\n```\\n\\n之后不用重复注册。\\n\\n---\\n\\n# 五、鉴权\\n\\n我建议使用：\\n\\n```text\\nclient_id\\n+\\ndevice_token\\n```\\n\\n建立 WebSocket 后第一条消息必须是：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"auth\\\",\\n  \\\"request_id\\\": \\\"req_xxx\\\",\\n  \\\"timestamp\\\": 1788566400000,\\n  \\\"payload\\\": {\\n    \\\"client_id\\\": \\\"clt_xxx\\\",\\n    \\\"device_token\\\": \\\"xxx\\\",\\n    \\\"client_version\\\": \\\"2.8.0\\\",\\n    \\\"protocol_version\\\": 1\\n  }\\n}\\n```\\n\\n服务端：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"auth_ack\\\",\\n  \\\"request_id\\\": \\\"req_xxx\\\",\\n  \\\"timestamp\\\": 1788566400100,\\n  \\\"payload\\\": {\\n    \\\"success\\\": true,\\n    \\\"session_id\\\": \\\"sess_xxx\\\",\\n    \\\"server_time\\\": 1788566400100,\\n    \\\"heartbeat_interval\\\": 30000\\n  }\\n}\\n```\\n\\n---\\n\\n# 六、不要让 Token 永久有效\\n\\n建议：\\n\\n```text\\ndevice_token\\n    ↓\\n长期凭证\\n```\\n\\n但是：\\n\\n```text\\nsession_id\\n    ↓\\nWebSocket连接凭证\\n```\\n\\n每次建立 WebSocket：\\n\\n```text\\ndevice_token\\n      ↓\\n认证\\n      ↓\\nsession_id\\n      ↓\\n本次连接使用\\n```\\n\\n断开之后 session 失效。\\n\\n这样安全性更好。\\n\\n---\\n\\n# 七、心跳机制\\n\\n这是整个系统非常重要的一部分。\\n\\n客户端每：\\n\\n```text\\n30秒\\n```\\n\\n发送：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"ping\\\",\\n  \\\"timestamp\\\": 1788566400000\\n}\\n```\\n\\n服务器：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"pong\\\",\\n  \\\"timestamp\\\": 1788566400005\\n}\\n```\\n\\n但是我建议**不要完全依赖 WebSocket 原生 ping/pong**。\\n\\n应用层也保留：\\n\\n```text\\nping\\npong\\n```\\n\\n这样你的后台能够知道：\\n\\n```text\\n最后心跳时间\\n连接持续时间\\nRTT\\n```\\n\\n例如：\\n\\n```text\\n客户端\\n├── Online\\n├── Last heartbeat: 14:32:10\\n├── RTT: 18ms\\n├── Connected: 3h 24m\\n└── Reconnect count: 2\\n```\\n\\n这对你后面的**楼控中心**非常有价值。\\n\\n---\\n\\n# 八、在线判断\\n\\n服务端不要：\\n\\n```text\\nWebSocket connected = 永远在线\\n```\\n\\n应该：\\n\\n```text\\nlast_heartbeat\\n```\\n\\n例如：\\n\\n```text\\n正常：\\n\u003c 60 秒\\n\\n疑似异常：\\n60～120 秒\\n\\n离线：\\n\u003e 120 秒\\n```\\n\\n所以：\\n\\n```text\\nWebSocket断开\\n       ↓\\n立即标记 disconnected\\n       ↓\\n等待重连\\n       ↓\\n超过阈值\\n       ↓\\nOFFLINE\\n```\\n\\n---\\n\\n# 九、自动重连\\n\\n客户端不要疯狂：\\n\\n```text\\n断开\\n↓\\n马上连接\\n↓\\n失败\\n↓\\n马上连接\\n↓\\n失败\\n```\\n\\n否则学校网络出问题时，100 台机器可能一起打爆服务端。\\n\\n使用：\\n\\n### Exponential Backoff\\n\\n```text\\n第1次：1s\\n第2次：2s\\n第3次：5s\\n第4次：10s\\n第5次：30s\\n之后：30s\\n```\\n\\n再增加随机抖动：\\n\\n```text\\ndelay = baseDelay + random(0~1000ms)\\n```\\n\\n这样：\\n\\n```text\\n100台客户端\\n      ↓\\n网络恢复\\n      ↓\\n不会100台同时连接\\n```\\n\\n---\\n\\n# 十、重新连接后的关键流程\\n\\n这里是整个协议最重要的地方。\\n\\n假设：\\n\\n```text\\n19:00:00\\n客户端在线\\n```\\n\\n突然网络断了：\\n\\n```text\\n19:00:10\\nWebSocket断开\\n```\\n\\n服务器期间产生：\\n\\n```text\\n19:00:15  切换考试\\n19:00:20  锁定屏幕\\n19:00:30  推送通知\\n```\\n\\n客户端没收到。\\n\\n重新连接：\\n\\n```text\\n19:00:40\\n      │\\n      ▼\\n重新认证\\n      │\\n      ▼\\n发送 last_event_id\\n      │\\n      ▼\\n服务器补发遗漏事件\\n```\\n\\n---\\n\\n# 十一、Event ID\\n\\n服务器推送的每一条重要事件都必须拥有：\\n\\n```text\\nevent_id\\n```\\n\\n例如：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command\\\",\\n  \\\"event_id\\\": 18231,\\n  \\\"timestamp\\\": 1788566410000,\\n  \\\"payload\\\": {\\n    \\\"command\\\": \\\"navigate\\\",\\n    \\\"target\\\": \\\"/exam/current\\\"\\n  }\\n}\\n```\\n\\n客户端成功处理之后：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"event_ack\\\",\\n  \\\"event_id\\\": 18231\\n}\\n```\\n\\n客户端本地保存：\\n\\n```text\\nlast_event_id = 18231\\n```\\n\\n---\\n\\n# 十二、离线补偿\\n\\n重新连接的时候：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"sync\\\",\\n  \\\"last_event_id\\\": 18231\\n}\\n```\\n\\n服务器：\\n\\n```text\\n数据库/事件表\\n\\n18232\\n18233\\n18234\\n18235\\n```\\n\\n然后：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"sync_data\\\",\\n  \\\"events\\\": [\\n    {...},\\n    {...},\\n    {...},\\n    {...}\\n  ],\\n  \\\"latest_event_id\\\": 18235\\n}\\n```\\n\\n客户端逐个处理。\\n\\n---\\n\\n# 十三、但是不是所有指令都应该补发\\n\\n这是非常重要的一点。\\n\\n例如：\\n\\n### 应该补发\\n\\n```text\\n切换考试\\n修改显示配置\\n更新考试安排\\n修改客户端设置\\n锁定状态\\n重要通知\\n```\\n\\n### 不应该补发\\n\\n```text\\n刷新页面\\n打开某页面\\n重新连接Agent\\n截图\\n播放提示音\\n```\\n\\n例如：\\n\\n```text\\n19:00:00\\n管理员点击“刷新客户端”\\n\\n19:00:01\\n客户端掉线\\n\\n19:00:10\\n客户端恢复\\n\\n19:00:11\\n再执行“刷新”\\n```\\n\\n显然：\\n\\n**19:00:00 那个刷新已经没有意义。**\\n\\n所以每个事件增加：\\n\\n```json\\n{\\n  \\\"delivery\\\": \\\"reliable\\\"\\n}\\n```\\n\\n或者：\\n\\n```json\\n{\\n  \\\"delivery\\\": \\\"latest\\\"\\n}\\n```\\n\\n---\\n\\n# 十四、我建议设计三种消息可靠性\\n\\n### 1. ephemeral\\n\\n一次性瞬时命令：\\n\\n```text\\nrefresh\\nopen_page\\nreconnect_agent\\nscreenshot\\n```\\n\\n断线不补。\\n\\n---\\n\\n### 2. latest\\n\\n只需要最新状态：\\n\\n```text\\ncurrent_exam\\ndisplay_config\\nlock_state\\nclient_settings\\n```\\n\\n客户端重新连接：\\n\\n\u003e 不需要补历史，只拿最新状态。\\n\\n---\\n\\n### 3. reliable\\n\\n必须保证收到：\\n\\n```text\\n重要通知\\n远程操作结果\\n配置修改\\n设备绑定\\n系统级操作\\n```\\n\\n通过：\\n\\n```text\\nevent_id\\nACK\\n重试\\n离线补偿\\n```\\n\\n保证。\\n\\n---\\n\\n# 十五、指令系统\\n\\n统一：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command\\\",\\n  \\\"event_id\\\": 18231,\\n  \\\"command_id\\\": \\\"cmd_xxx\\\",\\n  \\\"timestamp\\\": 1788566410000,\\n  \\\"delivery\\\": \\\"ephemeral\\\",\\n  \\\"payload\\\": {\\n    \\\"command\\\": \\\"refresh\\\"\\n  }\\n}\\n```\\n\\n---\\n\\n# 十六、Command ID\\n\\n这个也非常重要。\\n\\n例如管理员点击：\\n\\n```text\\n刷新客户端\\n```\\n\\n生成：\\n\\n```text\\ncommand_id = cmd_abc123\\n```\\n\\n客户端收到。\\n\\n执行：\\n\\n```text\\nwindow.location.reload()\\n```\\n\\n但是客户端在执行前记录：\\n\\n```text\\ncmd_abc123 = processing\\n```\\n\\n避免服务端重发以后执行两次。\\n\\n---\\n\\n# 十七、指令 ACK\\n\\n建议至少有三个状态：\\n\\n```text\\nreceived\\nexecuting\\ncompleted\\n```\\n\\n客户端收到：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command_ack\\\",\\n  \\\"command_id\\\": \\\"cmd_abc123\\\",\\n  \\\"status\\\": \\\"received\\\"\\n}\\n```\\n\\n开始执行：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command_ack\\\",\\n  \\\"command_id\\\": \\\"cmd_abc123\\\",\\n  \\\"status\\\": \\\"executing\\\"\\n}\\n```\\n\\n完成：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command_ack\\\",\\n  \\\"command_id\\\": \\\"cmd_abc123\\\",\\n  \\\"status\\\": \\\"completed\\\",\\n  \\\"result\\\": {\\n    \\\"success\\\": true\\n  }\\n}\\n```\\n\\n失败：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command_ack\\\",\\n  \\\"command_id\\\": \\\"cmd_abc123\\\",\\n  \\\"status\\\": \\\"failed\\\",\\n  \\\"error\\\": {\\n    \\\"code\\\": \\\"PAGE_NOT_FOUND\\\",\\n    \\\"message\\\": \\\"目标页面不存在\\\"\\n  }\\n}\\n```\\n\\n---\\n\\n# 十八、Novora 第一批指令\\n\\n你目前的项目可以先实现：\\n\\n```text\\nrefresh\\nnavigate\\ngo_home\\nreconnect\\nlock\\nunlock\\nswitch_exam\\nshow_message\\nreload_config\\nsync\\n```\\n\\n以后再增加：\\n\\n```text\\nrestart_agent\\nupdate_client\\nrestart_client\\nget_screenshot\\nget_status\\nclear_cache\\n```\\n\\n---\\n\\n# 十九、客户端状态上报\\n\\n客户端不仅接收命令，还应该主动报告：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"status\\\",\\n  \\\"timestamp\\\": 1788566410000,\\n  \\\"payload\\\": {\\n    \\\"page\\\": \\\"/exam/current\\\",\\n    \\\"client_version\\\": \\\"2.8.0\\\",\\n    \\\"agent_connected\\\": true,\\n    \\\"locked\\\": false,\\n    \\\"network\\\": \\\"online\\\",\\n    \\\"screen\\\": {\\n      \\\"width\\\": 1920,\\n      \\\"height\\\": 1080\\n    }\\n  }\\n}\\n```\\n\\n建议：\\n\\n```text\\n启动时 → 上报\\n页面切换 → 上报\\n考试切换 → 上报\\nAgent状态变化 → 上报\\n锁定状态变化 → 上报\\n每5分钟 → 状态上报\\n```\\n\\n不要每秒发送。\\n\\n---\\n\\n# 二十、消息统一格式\\n\\n最终建议所有 WebSocket 消息统一：\\n\\n```json\\n{\\n  \\\"protocol\\\": \\\"NCRP/1\\\",\\n  \\\"type\\\": \\\"command\\\",\\n  \\\"request_id\\\": \\\"req_xxx\\\",\\n  \\\"event_id\\\": 18231,\\n  \\\"command_id\\\": \\\"cmd_xxx\\\",\\n  \\\"timestamp\\\": 1788566410000,\\n  \\\"delivery\\\": \\\"ephemeral\\\",\\n  \\\"payload\\\": {}\\n}\\n```\\n\\n其中：\\n\\n| 字段 | 用途 |\\n|---|---|\\n| protocol | 协议版本 |\\n| type | 消息类型 |\\n| request_id | 请求/响应关联 |\\n| event_id | 事件顺序 |\\n| command_id | 指令唯一 ID |\\n| timestamp | 时间 |\\n| delivery | 投递策略 |\\n| payload | 实际数据 |\\n\\n---\\n\\n# 二十一、建议的消息类型\\n\\n最终可以定义：\\n\\n```text\\nconnection\\n├── auth\\n├── auth_ack\\n├── ping\\n├── pong\\n│\\ndevice\\n├── register\\n├── register_ack\\n├── status\\n├── heartbeat\\n│\\nevent\\n├── event\\n├── event_ack\\n│\\ncommand\\n├── command\\n├── command_ack\\n│\\nsync\\n├── sync\\n├── sync_data\\n├── sync_complete\\n│\\nerror\\n└── error\\n```\\n\\n---\\n\\n# 二十二、服务端数据库\\n\\n这里我特别建议你**不要把 WebSocket 状态全部塞进现有考试表**。\\n\\n增加：\\n\\n```text\\nclients\\n```\\n\\n例如：\\n\\n```text\\nclients\\n--------------------------------\\nid\\nclient_id\\ndevice_name\\ndevice_type\\nstatus\\nclient_version\\nplatform\\nlast_seen_at\\nlast_event_id\\nlast_ip\\ncreated_at\\nupdated_at\\n```\\n\\n再增加：\\n\\n```text\\nclient_sessions\\n```\\n\\n```text\\nclient_sessions\\n--------------------------------\\nid\\nclient_id\\nsession_id\\nconnected_at\\ndisconnected_at\\nlast_heartbeat_at\\nip\\nuser_agent\\n```\\n\\n再增加：\\n\\n```text\\nclient_events\\n```\\n\\n```text\\nclient_events\\n--------------------------------\\nid\\nevent_id\\nclient_id\\ntype\\npayload\\ndelivery\\ncreated_at\\nexpires_at\\n```\\n\\n不过这里可以优化：\\n\\n**不要永久保存所有 WebSocket 事件。**\\n\\n例如：\\n\\n```text\\nephemeral → 不入库\\nlatest    → 存当前状态\\nreliable  → 保存 24～72 小时\\n```\\n\\n---\\n\\n# 二十三、离线补偿流程\\n\\n最终完整流程：\\n\\n```text\\n                 客户端\\n                    │\\n                    │ WS\\n                    ▼\\n              ┌───────────┐\\n              │ WebSocket │\\n              │ Server    │\\n              └─────┬─────┘\\n                    │\\n             ┌──────┴──────┐\\n             │             │\\n         当前状态        事件队列\\n             │             │\\n             ▼             ▼\\n       client_state    client_events\\n```\\n\\n客户端断线：\\n\\n```text\\n             网络断开\\n                 │\\n                 ▼\\n             本地继续运行\\n                 │\\n                 │\\n       ┌─────────┴─────────┐\\n       │                   │\\n   页面继续显示        本地记录状态\\n       │\\n       ▼\\n     重连\\n       │\\n       ▼\\n     AUTH\\n       │\\n       ▼\\n     SYNC\\n       │\\n       ▼\\n  获取最新状态\\n       │\\n       ▼\\n  补 reliable 事件\\n       │\\n       ▼\\n     ONLINE\\n```\\n\\n这就能达到你需要的效果：\\n\\n\u003e **网络断了，考试大屏依然正常显示；网络恢复后自动追上服务端状态。**\\n\\n---\\n\\n# 二十四、一个完整例子\\n\\n假设现在正在进行：\\n\\n```text\\n高一数学周测\\n```\\n\\n管理员在学校服务端点击：\\n\\n\u003e 切换到英语考试\\n\\n服务端生成：\\n\\n```text\\nevent_id = 10086\\ncommand_id = cmd_abc\\n```\\n\\n推送：\\n\\n```json\\n{\\n  \\\"protocol\\\": \\\"NCRP/1\\\",\\n  \\\"type\\\": \\\"command\\\",\\n  \\\"event_id\\\": 10086,\\n  \\\"command_id\\\": \\\"cmd_abc\\\",\\n  \\\"timestamp\\\": 1788566410000,\\n  \\\"delivery\\\": \\\"reliable\\\",\\n  \\\"payload\\\": {\\n    \\\"command\\\": \\\"switch_exam\\\",\\n    \\\"exam_id\\\": \\\"exam_english_20260905\\\"\\n  }\\n}\\n```\\n\\n客户端：\\n\\n```text\\n收到\\n ↓\\nACK received\\n ↓\\n检查exam_id\\n ↓\\n切换考试\\n ↓\\nACK completed\\n ↓\\n更新本地状态\\n```\\n\\n然后：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"command_ack\\\",\\n  \\\"command_id\\\": \\\"cmd_abc\\\",\\n  \\\"status\\\": \\\"completed\\\"\\n}\\n```\\n\\n管理员界面立即显示：\\n\\n```text\\n高一1班\\n● 在线\\n✓ 指令已完成\\nRTT 18ms\\n```\\n\\n---\\n\\n# 二十五、如果客户端刚好断网\\n\\n情况：\\n\\n```text\\n10086 → 切换英语\\n10087 → 修改显示配置\\n10088 → 推送通知\\n```\\n\\n客户端当时：\\n\\n```text\\nlast_event_id = 10085\\n```\\n\\n恢复连接：\\n\\n```json\\n{\\n  \\\"type\\\": \\\"sync\\\",\\n  \\\"last_event_id\\\": 10085\\n}\\n```\\n\\n服务端发现：\\n\\n```text\\n10086\\n10087\\n10088\\n```\\n\\n全部是 reliable。\\n\\n于是：\\n\\n```text\\n补发 10086\\n补发 10087\\n补发 10088\\n```\\n\\n但是如果：\\n\\n```text\\n10089 = refresh\\n```\\n\\n就直接忽略。\\n\\n最后：\\n\\n```text\\nlatest_event_id = 10089\\n```\\n\\n客户端同步完成。\\n\\n---\\n\\n# 二十六、还有一个非常重要的设计：版本兼容\\n\\n以后你的客户端可能存在：\\n\\n```text\\n2.7.3\\n2.8.0\\n2.8.1\\n2.9.0\\n```\\n\\n因此 WebSocket 必须带：\\n\\n```json\\n{\\n  \\\"protocol\\\": \\\"NCRP/1\\\",\\n  \\\"client_version\\\": \\\"2.8.0\\\"\\n}\\n```\\n\\n服务端根据协议版本判断。\\n\\n例如：\\n\\n```text\\nNCRP/1\\nNCRP/2\\n```\\n\\n未来协议升级时：\\n\\n```text\\n旧客户端 → NCRP/1\\n新客户端 → NCRP/2\\n```\\n\\n不要因为服务端升级直接把所有旧客户端踢掉。\\n\\n---\\n\\n# 二十七、最终推荐的 Novora 实际架构\\n\\n我会把你现在整个通信体系定成：\\n\\n```text\\n                 Vercel / CDN\\n                      │\\n                 前端静态资源\\n                      │\\n                      ▼\\n              ┌───────────────┐\\n              │ Novora Client │\\n              └───────┬───────┘\\n                      │\\n             ┌────────┴────────┐\\n             │                 │\\n           HTTPS             WSS\\n             │                 │\\n             ▼                 ▼\\n       REST API          WebSocket\\n             │                 │\\n             └────────┬────────┘\\n                      ▼\\n             ┌─────────────────┐\\n             │  学校服务端     │\\n             │                 │\\n             │ API             │\\n             │ WebSocket       │\\n             │ Client Manager  │\\n             │ Event Manager   │\\n             └────────┬────────┘\\n                      │\\n                      ▼\\n                 PostgreSQL\\n```\\n\\n然后：\\n\\n```text\\nWebSocket\\n= 实时通信\\n\\nHTTP\\n= 初始化 + 查询 + 兜底\\n\\nPostgreSQL\\n= 最终状态\\n\\nEvent Queue\\n= 可靠消息\\n\\nClient\\n= 本地状态缓存\\n```\\n\\n**这套结构非常适合你后面做“楼控中心”。**\\n\\n因为以后楼控中心可以直接看到：\\n\\n```text\\n教学楼 A\\n\\n在线      48\\n离线       2\\n异常       1\\n连接中     1\\n\\n┌──────┬──────┬──────┬──────┐\\n│ 高一1 │ 高一2 │ 高一3 │ 高一4 │\\n│ 🟢   │ 🟢   │ 🟡   │ 🔴   │\\n│18ms   │24ms   │断线   │异常  │\\n└──────┴──────┴──────┴──────┘\\n```\\n\\n点击某个教室以后，还可以直接看到：\\n\\n```text\\n连接状态\\n最后心跳\\nRTT\\n客户端版本\\nAgent状态\\n当前页面\\n当前考试\\n锁定状态\\n最近指令\\n指令执行结果\\n最近异常\\n```\\n\\n这会让你的**客户端 → 学校服务端 → 楼控中心**形成一条完整的实时运维链路。\\n\\n如果现在开始实现，我建议 **v2.8 第一版只做 `认证 → 心跳 → 自动重连 → 状态上报 → command + ACK → latest 状态同步`，暂时不要一开始就做复杂的事件队列**。等基础链路稳定后，再加 `event_id + reliable + 离线补偿`，这样开发风险最低。\",{},{\"_158\":2068,\"_165\":2334,\"_54\":2335,\"_169\":2336,\"_171\":172,\"_174\":175,\"_176\":2337,\"_178\":179},\"bbb212ba-9a4d-44f4-8e6a-929 :-5},{\"_158\":2401,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2400,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2399,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2398,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2397,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2396,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2395,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2394,\"_297\":14,\"_298\":14,\"_299\":-5},{\"_158\":2393,\"_297\":14,\"_298\":14,\"_299\":-5},\"9a3yld\",\"xgakc4\",\"eo2ks3\",\"9c6pqf\",\"spzdyo\",\"1ftkuq\",\"t8xf02\",\"la26yk\",\"1pc7wb\",\"dzrfp5\",\"7cgyjk\",\"a2p6kn\",\"oaq1m6\",{\"_50\":2407,\"_664\":2408,\"_667\":2409,\"_669\":2410,\"_47\":2408,\"_674\":2361},\"followup_a\",\"设计一套 **Novora 客户端 WebSocket 协议（心跳、重连、鉴权、设备注册、指令 ACK、离线补偿）**\",2948,3007,[759],[2413],\"会，而且**如果你的 Novora 学校客户端是长期在线的大屏，我不建议把 WebSocket 长连接的核心链路直接放在 Vercel 上**。\\n\\n结合你现在的架构：\\n\\n\u003e 学校客户端网页 → 学校服务端 → 作者端\\n\\n如果你考虑的是：\\n\\n\u003e 学校客户端网页 → WebSocket → Vercel\\n\\n那么主要问题不是“WebSocket 能不能连”，而是**它是否适合你这种 24/7 大量客户端保持连接的场景**。\\n\\n### 我的推荐\\n\\n| 方案 | 稳定性 | 适合 Novora | 推荐 |\\n|---|---|---|---|\\n| 客户端 → Vercel WebSocket | ⭐⭐⭐ | 一般 | ❌ |\\n| 客户端 → 学校服务端 WebSocket | ⭐⭐⭐⭐⭐ | **非常适合** | ✅ |\\n| 客户端 → 云服务器 WebSocket | ⭐⭐⭐⭐⭐ | 适合 | ✅ |\\n| 客户端 → Vercel HTTP 轮询 | ⭐⭐⭐⭐ | 可以 | ⚠️ |\\n| 客户端 → 学校服务端 HTTP 轮询 | ⭐⭐⭐⭐⭐ | 可以 | ✅ |\\n\\n### 为什么你的情况更适合学校服务端\\n\\n你的客户端本身就在学校内部使用，而且学校服务端也是 Docker 部署。\\n\\n最合理的是：\\n\\n```text\\n                  Internet\\n                     │\\n              ┌──────▼──────┐\\n              │   Vercel    │\\n              │ 前端/静态资源 │\\n              └──────┬──────┘\\n                     │ HTTPS\\n                     │\\n              ┌──────▼──────┐\\n              │ 学校服务端   │\\n              │ Docker      │\\n              │ API + WS    │\\n              └──────┬──────┘\\n                     │\\n              WebSocket\\n                     │\\n       ┌─────────────┼─────────────┐\\n       ▼             ▼             ▼\\n    教室客户端     教室客户端     教室客户端\\n```\\n\\n也就是说：\\n\\n**Vercel负责“网页”，学校服务端负责“实时通信”。**\\n\\n客户端打开：\\n\\n```text\\nhttps://exam.pikachu2026.space/\\n```\\n\\n网页资源可以从 Vercel/CDN 获取。\\n\\n然后 JavaScript 启动：\\n\\n```text\\nWebSocket → wss://学校服务端/ws\\n```\\n\\n这样会非常适合你的场景。\\n\\n---\\n\\n### 而且你之前问的“轮询还是 WebSocket”，我现在更明确建议\\n\\n你的客户端应该：\\n\\n**WebSocket 为主 + HTTP API 为辅 + 自动重连。**\\n\\n例如：\\n\\n```text\\n客户端启动\\n   │\\n   ├── HTTP → 获取当前考试/配置\\n   │\\n   └── WebSocket → 建立实时连接\\n                    │\\n                    ├── 考试切换\\n                    ├── 页面刷新\\n                    ├── 锁定屏幕\\n                    ├── 跳转页面\\n                    ├── Agent状态\\n                    ├── 服务端通知\\n                    └── 远程消息\\n```\\n\\nWebSocket 断开：\\n\\n```text\\nWebSocket断开\\n      │\\n      ▼\\n立即尝试重连\\n      │\\n      ├── 失败 → 2s\\n      ├── 失败 → 5s\\n      ├── 失败 → 10s\\n      ├── 失败 → 30s\\n      └── 成功 → 恢复正常\\n```\\n\\n同时可以保留一个很低频的 HTTP 兜底，例如：\\n\\n```text\\n每 1～5 分钟\\n    ↓\\nGET /api/client/sync\\n```\\n\\n这样即使 WebSocket 因为学校网络、代理、路由器等原因断掉，客户端最终也能同步到最新状态。\\n\\n---\\n\\n### 最关键的一点\\n\\n如果你的**学校服务端和客户端在同一个校园网络**，WebSocket甚至可以完全不经过公网：\\n\\n```text\\n                学校局域网\\n\\n┌──────────┐\\n│客户端 01 │──┐\\n└──────────┘  │\\n┌──────────┐  │\\n│客户端 02 │──┼──→ 学校服务端 :xxxx\\n└──────────┘  │       │\\n┌──────────┐  │       └── PostgreSQL\\n│客户端 03 │──┘\\n└──────────┘\\n```\\n\\n这比：\\n\\n```text\\n客户端\\n  ↓\\n公网\\n  ↓\\nVercel\\n  ↓\\n公网\\n  ↓\\n学校服务端\\n```\\n\\n稳定得多。\\n\\n而且延迟基本可以做到毫秒～几十毫秒级。\\n\\n---\\n\\n## Vercel可以继续用，但不要让它承担这个职责\\n\\n我反而建议你的 Novora 最终架构明确拆开：\\n\\n```text\\nVercel\\n│\\n├── Novora Web 前端\\n├── 作者端前端\\n└── 文档/官网\\n```\\n\\n学校服务端：\\n\\n```text\\n学校 Docker\\n│\\n├── REST API\\n├── WebSocket Server\\n├── 数据库\\n├── Agent管理\\n├── 客户端管理\\n├── 楼控\\n├── 考试系统\\n└── 运维/错误日志\\n```\\n\\n客户端：\\n\\n```text\\n浏览器\\n│\\n├── HTTPS → 获取前端\\n├── HTTP  → 获取数据\\n└── WS    → 实时控制\\n```\\n\\n作者端：\\n\\n```text\\n作者端\\n   │\\n   HTTPS\\n   ▼\\n作者服务器\\n   │\\n   ├── 学校实例管理\\n   ├── 版本管理\\n   ├── 错误上报\\n   └── 远程运维\\n```\\n\\n这样以后你即使把：\\n\\n```text\\npikachu2026.space\\n```\\n\\n换成其他域名，或者把 Vercel 换成 Cloudflare Pages、自己的服务器，都不会影响客户端的实时通信架构。\\n\\n**所以对于 Novora，我会把 WebSocket 放在“学校服务端”，而不是 Vercel。**\\n\\n如果你愿意，我还可以进一步给你设计一套 **Novora 客户端 WebSocket 协议（心跳、重连、鉴权、设备注册、指令 ACK、离线补偿）**，这套做好后基本就可以直接进入代码实现。\",{},{\"_158\":2364,\"_165\":2418,\"_54\":2419,\"_169\":2420,\"_171\":172,\"_174\":175,\"_176\":2421,\"_178\":179},\"5609f982-659e-4de5-b237-57401529bf95\",[2340],{\"_765\":766,\"_176\":2422},1788543188.4349868,{\"_760\":2033,\"_2034\":673},{\"_197\":198,\"_203\":2378,\"_205\":2378,\"_208\":2416,\"_209\":10,\"_836\":34},{},{\"_158\":2416,\"_165\":2426,\"_54\":2427,\"_169\":2428,\"_171\":172,\"_174\":175,\"_176\":2429,\"_178\":179},\"c745849c-a46b-41d9-8428-94b751ea84fb\",[2364],{\"_765\":940,\"_176\":2432},1788543188.247683,{\"_760\":761,\"_762\":2431},{\"_935\":34,\"_194\":2079,\"_197\":198,\"_199\":2377,\"_201\":202,\"_203\":2378,\"_205\":2378,\"_206\":2079,\"_66\":67,\"_2084\":2430,\"_208\":2424,\"_209\":10,\"_207\":14},[2086],[673],{},{\"_158\":2424,\"_165\":2436,\"_54\":2437,\"_169\":2438,\"_171\":172,\"_173\":34,\"_174\":438,\"_176\":2439,\"_178\":179},\"635bf575-aed7-4800-99f0-59a21ed389a1\",[2416],{\"_765\":940,\"_176\":2442},1788543189.013477,{\"_760\":761,\"_762\":2441},{\"_958\":34,\"_935\":34,\"_194\":2079,\"_197\":198,\"_199\":2377,\"_201\":202,\"_203\":2378,\"_205\":2378,\"_206\":2079,\"_66\":67,\"_2084\":2440,\"_208\":2434,\"_209\":10,\"_207\":14},[2086],[673],{},{\"_158\":2434,\"_165\":2446,\"_54\":2447,\"_169\":2448,\"_171\":172,\"_173\":34,\"_174\":438,\"_176\":2449,\"_178\":179},\"bbb2157b-1049-463a-91a8-9707e7d7a4ed\",[2424],{\"_765\":940,\"_176\":2452},1788543188.997229,{\"_760\":761,\"_762\":2451},{\"_968\":34,\"_935\":34,\"_194\":2079,\"_197\":198,\"_199\":2377,\"_201\":202,\"_203\":2378,\"_205\":2378,\"_206\":2079,\"_66\":67,\"_2084\":2450,\"_208\":2444,\"_209\":10,\"_207\":14},[2086],[673],{},{\"_158\":2444,\"_165\":2456,\"_54\":2457,\"_56\":2458,\"_169\":245
