<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Novora icon</title>
  <desc id="desc">A geometric N inside a clock face with a small nova spark.</desc>
  <rect width="1024" height="1024" rx="224" fill="#111827"/>

  <!-- Clock face: the open arc leaves room for the Nova signature. -->
  <path d="M725 230A340 340 0 1 0 798 300" fill="none" stroke="#42D3C8" stroke-width="64" stroke-linecap="round"/>

  <!-- Four bold timing marks remain legible at favicon size. -->
  <g fill="#F7F4EC">
    <rect x="484" y="194" width="56" height="88" rx="28"/>
    <rect x="742" y="484" width="88" height="56" rx="28"/>
    <rect x="484" y="742" width="56" height="88" rx="28"/>
    <rect x="194" y="484" width="88" height="56" rx="28"/>
  </g>

  <!-- The N doubles as a connected schedule path and a pair of clock hands. -->
  <path d="M354 676V348L670 676V348" fill="none" stroke="#F7F4EC" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="354" cy="676" r="38" fill="#42D3C8"/>
  <circle cx="670" cy="348" r="38" fill="#42D3C8"/>

  <!-- PikaNova signature. -->
  <path d="M798 154L822 210L878 234L822 258L798 314L774 258L718 234L774 210Z" fill="#FFC857"/>
</svg>
